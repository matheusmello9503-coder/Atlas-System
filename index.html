/* ─── Helpers ─────────────────────────────────────────── */
const nowISO = () => new Date().toISOString();
const uid    = () => Math.random().toString(36).slice(2,8).toUpperCase();

function fmtTime(iso){
  if(!iso) return "—";
  return new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function fmtDate(iso){
  if(!iso) return "—";
  return new Date(iso).toLocaleDateString("pt-BR");
}
function diffMin(a,b){
  if(!a||!b) return null;
  const d = Math.round((new Date(b)-new Date(a))/60000);
  return d < 0 ? 0 : d;
}
function todayStr(){ return fmtDate(new Date().toISOString()); }

/* ─── Dados fixos ─────────────────────────────────────── */
const EXAM_TYPES = [
  "Abdominal Total","Abdominal Superior","Abdominal Inferior",
  "Obstétrico","Obstétrico Morfológico","Pélvico / Ginecológico",
  "Transvaginal","Mama","Tireoide","Cervical","Renal",
  "Próstata","Testicular","Articular","Musculotendinoso",
  "Doppler Vascular","Doppler Obstétrico","Partes Moles","Outro"
];
const CONVENIOS = [
  "Particular","Unimed","Bradesco Saúde","SulAmérica","Amil",
  "Hapvida","NotreDame","Cassi","Geap","Outro Convênio"
];
const PRIORIDADES = [
  {v:"normal",   l:"Normal",    cor:"#3b82f6"},
  {v:"gestante", l:"Gestante",  cor:"#a855f7"},
  {v:"idoso",    l:"Idoso ≥60", cor:"#f59e0b"},
  {v:"crianca",  l:"Criança",   cor:"#06b6d4"},
  {v:"deficiente",l:"PcD",      cor:"#10b981"},
  {v:"emergencia",l:"Emergência",cor:"#ef4444"}
];
const ADVERSOS = [
  "Paciente sem preparo (jejum)","Documento incorreto / ausente",
  "Atraso na autorização de convênio","Atraso do médico",
  "Falha no equipamento","Dificuldade de mobilidade",
  "Exame interrompido","Troca de sala","Outro"
];

function statusOf(p){
  if(p.cancelado||p.desistiu)          return "encerrado";
  if(p.saidaClinica)                   return "concluido";
  if(p.fimExame)                       return "aguardando_saida";
  if(p.inicioExame)                    return "em_exame";
  if(p.fimRecepcao)                    return "aguardando_exame";
  if(p.inicioRecepcao)                 return "na_recepcao";
  return "chegou";
}
const STATUS_META = {
  chegou:           {l:"Aguardando recepção",   cor:"#f59e0b"},
  na_recepcao:      {l:"Em atendimento recepção",cor:"#3b82f6"},
  aguardando_exame: {l:"Aguardando exame",       cor:"#a855f7"},
  em_exame:         {l:"Em exame",               cor:"#10b981"},
  aguardando_saida: {l:"Aguardando saída",        cor:"#06b6d4"},
  concluido:        {l:"Concluído",              cor:"#6b7280"},
  encerrado:        {l:"Cancelado/Desistência",  cor:"#ef4444"}
};

══════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════
   ROTEADOR DE TELAS
══════════════════════════════════════════════════════════ */
function render(tela, dados={}){
  document.getElementById("app").innerHTML = "";
  const fns = {
    login:       telaLogin,
    recepcao:    telaRecepcao,
    sala:        telaSala,
    supervisor:  telaSupervisor,
    detalhe:     telaDetalhe,
    admin:       telaAdmin
  };
  (fns[tela]||telaLogin)(dados);
}

/* ══════════════════════════════════════════════════════════
   TELA DE LOGIN
══════════════════════════════════════════════════════════ */
function telaLogin(){
  const app = document.getElementById("app");
  app.innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo-block">
        <div class="logo-icon">◈</div>
        <div class="logo-text">CERDIL</div>
        <div class="logo-sub">Sistema de Coleta · Ultrassonografia</div>
      </div>
      <div class="field-group">
        <label class="field-label">Usuário</label>
        <input id="l-user" class="field-input" placeholder="seu.usuario" autocomplete="off"/>
      </div>
      <div class="field-group">
        <label class="field-label">Senha</label>
        <input id="l-pass" class="field-input" type="password" placeholder="••••••"/>
      </div>
      <div id="l-err" class="error-msg" style="display:none"></div>
      <button class="btn-primary full" id="l-btn">Entrar</button>
      <div class="login-hint">Primeiro acesso? Use: <strong>admin</strong> / <strong>admin123</strong></div>
    </div>
  </div>`;

  const doLogin = async () => {
    const u = document.getElementById("l-user").value.trim().toLowerCase();
    const p = document.getElementById("l-pass").value;
    const err = document.getElementById("l-err");
    if(!u||!p){ err.style.display="block"; err.textContent="Preencha usuário e senha."; return; }

    const snap = await get(ref(db,"usuarios"));
    const lista = snap.val()||{};

    // Verificar admin padrão
    let found = null;
    Object.entries(lista).forEach(([id,ud])=>{
      if(ud.usuario===u && ud.senha===p && ud.ativo!==false) found={...ud,id};
    });
    // Conta admin padrão hardcoded se não há nenhum usuário
    if(!found && u==="admin" && p==="admin123" && Object.keys(lista).length===0){
      found={id:"root",nome:"Administrador",usuario:"admin",perfil:"admin"};
    }
    if(!found){ err.style.display="block"; err.textContent="Usuário ou senha incorretos."; return; }
    currentUser = found;
    const destino = {recepcao:"recepcao",sala:"sala",supervisor:"supervisor",admin:"admin"}[found.perfil]||"recepcao";
    iniciarListeners();
    render(destino);
  };

  document.getElementById("l-btn").onclick = doLogin;
  document.getElementById("l-pass").onkeydown = e => { if(e.key==="Enter") doLogin(); };
}

/* ══════════════════════════════════════════════════════════
   LISTENERS FIREBASE TEMPO REAL
══════════════════════════════════════════════════════════ */
let listenersOn = false;
function iniciarListeners(){
  if(listenersOn) return;
  listenersOn = true;
  onValue(ref(db,"pacientes"), snap => {
    pacientes = snap.val()||{};
    if(currentUser) atualizarConteudo();
  });
  onValue(ref(db,"usuarios"), snap => {
    usuarios = snap.val()||{};
  });
}

function atualizarConteudo(){
  const tela = document.getElementById("app").dataset.tela;
  if(!tela) return;
  const fns = {recepcao:conteudoRecepcao,sala:conteudoSala,supervisor:conteudoSupervisor};
  if(fns[tela]) fns[tela]();
}

function conteudoRecepcao(){
  const el = document.getElementById("content-recepcao");
  if(!el) return;
  const hoje = Object.entries(pacientes)
    .filter(([,p])=> fmtDate(p.chegadaRecepcao)===todayStr())
    .sort((a,b)=> new Date(a[1].chegadaRecepcao)-new Date(b[1].chegadaRecepcao));

  const ativos = hoje.filter(([,p])=> !p.saidaClinica && !p.cancelado && !p.desistiu);
  const conc   = hoje.filter(([,p])=> p.saidaClinica || p.cancelado || p.desistiu);

  let html = `<div class="section-title">Pacientes de Hoje — ${hoje.length} no total</div>`;

  // Contadores de status
  html += `<div class="status-bar">`;
  Object.entries(STATUS_META).forEach(([k,m])=>{
    const c = hoje.filter(([,p])=>statusOf(p)===k).length;
    if(c>0) html+=`<div class="status-chip" style="border-color:${m.cor}44;background:${m.cor}15;color:${m.cor}">
      <span class="status-count">${c}</span><span class="status-lbl">${m.l}</span>
    </div>`;
  });
  html += `</div>`;

  if(ativos.length===0 && conc.length===0){
    html += `<div class="empty-state">Nenhum paciente registrado hoje.<br>Toque em "+ Novo paciente" para começar.</div>`;
  }

  if(ativos.length>0){
    html += `<div class="list-header">Ativos (${ativos.length})</div>`;
    // Ordenar por prioridade
    const ordemPri = {emergencia:0,gestante:1,idoso:1,crianca:1,deficiente:1,normal:2};
    const sorted = [...ativos].sort((a,b)=> (ordemPri[a[1].prioridade]||2)-(ordemPri[b[1].prioridade]||2));
    sorted.forEach(([id,p])=> html+=cardPaciente(id,p,"recepcao"));
  }

  if(conc.length>0){
    html += `<div class="list-header" style="margin-top:24px">Concluídos / Encerrados (${conc.length})</div>`;
    conc.slice(0,30).forEach(([id,p])=> html+=cardPaciente(id,p,"recepcao"));
  }

  el.innerHTML = html;
  el.querySelectorAll("[data-pid]").forEach(card=>{
    card.onclick = ()=> render("detalhe",{id:card.dataset.pid, origem:"recepcao"});
  });
}

      <div class="topbar-left">

  </div>

  document.getElementById("btn-logout-sala").onclick = ()=>{ currentUser=null; listenersOn=false; render("login"); };

function conteudoSala(){
  const el = document.getElementById("content-sala");
  if(!el) return;
  const hoje = Object.entries(pacientes)
    .filter(([,p])=> fmtDate(p.chegadaRecepcao)===todayStr());

  // Fila para a sala = liberados pela recepção, ainda não finalizados
  const fila = hoje.filter(([,p])=> p.fimRecepcao && !p.saidaClinica && !p.cancelado && !p.desistiu)
    .sort((a,b)=>new Date(a[1].fimRecepcao)-new Date(b[1].fimRecepcao));

  // Em exame agora
  const emExame = fila.filter(([,p])=>p.inicioExame && !p.fimExame);
  // Aguardando
  const aguardando = fila.filter(([,p])=>!p.inicioExame);
  // Aguardando saída
  const aguardSaida = hoje.filter(([,p])=>p.fimExame && !p.saidaClinica && !p.cancelado && !p.desistiu);

  let html = "";

  if(emExame.length>0){
    html += `<div class="list-header" style="color:#10b981">🟢 Em Exame Agora (${emExame.length})</div>`;
    emExame.forEach(([id,p])=> html+=cardPaciente(id,p,"sala"));
  }

  if(aguardando.length>0){
    html += `<div class="list-header" style="color:#a855f7;margin-top:20px">🟣 Aguardando Exame (${aguardando.length})</div>`;
    const ordemPri = {emergencia:0,gestante:1,idoso:1,crianca:1,deficiente:1,normal:2};
    [...aguardando].sort((a,b)=>(ordemPri[a[1].prioridade]||2)-(ordemPri[b[1].prioridade]||2))
      .forEach(([id,p])=> html+=cardPaciente(id,p,"sala"));
  }

  if(aguardSaida.length>0){
    html += `<div class="list-header" style="color:#06b6d4;margin-top:20px">🔵 Aguardando Saída (${aguardSaida.length})</div>`;
    aguardSaida.forEach(([id,p])=> html+=cardPaciente(id,p,"sala"));
  }

  if(fila.length===0 && aguardSaida.length===0){
    html = `<div class="empty-state" style="border-color:#a855f733">
      Nenhum paciente aguardando exame.<br>
      <span style="font-size:12px;opacity:.6">Os pacientes aparecerão aqui após liberação pela recepção.</span>
    </div>`;
  }

  el.innerHTML = html;
  el.querySelectorAll("[data-pid]").forEach(card=>{
    card.onclick = ()=> render("detalhe",{id:card.dataset.pid, origem:"sala"});
  });
}

function conteudoSupervisor(aba="painel"){
  const el = document.getElementById("content-supervisor");
  if(!el) return;
  const hoje = Object.entries(pacientes).filter(([,p])=> fmtDate(p.chegadaRecepcao)===todayStr());
  const conc  = hoje.filter(([,p])=>p.saidaClinica && !p.cancelado && !p.desistiu);

  if(aba==="painel"){
    const ativos = hoje.filter(([,p])=>!p.saidaClinica && !p.cancelado && !p.desistiu);
    const mediaEspera = calcMedia(conc, p=>diffMin(p.fimRecepcao,p.inicioExame));
    const mediaExame  = calcMedia(conc, p=>diffMin(p.inicioExame,p.fimExame));
    const mediaTotal  = calcMedia(conc, p=>diffMin(p.chegadaRecepcao,p.saidaClinica));

    let html = `<div class="kpi-grid">
      ${kpi("Atendidos",hoje.length,"#3b82f6")}
      ${kpi("Concluídos",conc.length,"#10b981")}
      ${kpi("Ativos",ativos.length,"#f59e0b")}
      ${kpi("Cancelados/Desist.",hoje.filter(([,p])=>p.cancelado||p.desistiu).length,"#ef4444")}
    </div>
    <div class="kpi-grid" style="margin-top:10px">
      ${kpi("Espera Média",mediaEspera!=null?mediaEspera+"min":"—","#f59e0b")}
      ${kpi("Exame Médio",mediaExame!=null?mediaExame+"min":"—","#3b82f6")}
      ${kpi("Total Médio",mediaTotal!=null?mediaTotal+"min":"—","#10b981")}
    </div>`;

    // Distribuição por tipo de exame
    const tipoCount = {};
    hoje.forEach(([,p])=>{ tipoCount[p.exame]=(tipoCount[p.exame]||0)+1; });
    const maxT = Math.max(...Object.values(tipoCount),1);
    html += `<div class="section-title" style="margin-top:20px">Exames Hoje</div><div class="exam-chart">`;
    Object.entries(tipoCount).sort((a,b)=>b[1]-a[1]).forEach(([tipo,cnt])=>{
      html+=`<div class="chart-row">
        <div class="chart-label">${tipo}</div>
        <div class="chart-bar-wrap"><div class="chart-bar" style="width:${Math.round(cnt/maxT*100)}%"></div></div>
        <div class="chart-val">${cnt}</div>
      </div>`;
    });
    html += `</div>`;

    // Adversos
    const advs = hoje.flatMap(([,p])=>(p.adversos||[]).map(a=>({...a,pacNome:p.nome})));
    if(advs.length>0){
      html += `<div class="section-title" style="margin-top:20px">⚠ Eventos Adversos (${advs.length})</div>`;
      advs.forEach(a=>{
        html+=`<div class="adverse-chip">⚠ ${a.tipo} <span style="color:#6b7280;margin-left:8px">${a.pacNome} · ${fmtTime(a.ts)}</span></div>`;
      });
    }
    el.innerHTML = html;

  } else if(aba==="todos"){
    let html = `<div class="section-title">Todos os registros de hoje (${hoje.length})</div>`;
    if(hoje.length===0) html+=`<div class="empty-state">Nenhum registro hoje.</div>`;
    [...hoje].sort((a,b)=>new Date(b[1].chegadaRecepcao)-new Date(a[1].chegadaRecepcao))
      .forEach(([id,p])=> html+=cardPaciente(id,p,"supervisor"));
    el.innerHTML = html;
    el.querySelectorAll("[data-pid]").forEach(card=>{
      card.onclick = ()=> render("detalhe",{id:card.dataset.pid, origem:"supervisor"});
    });

  } else if(aba==="relatorio"){
    // Estatísticas por período
    const todos = Object.entries(pacientes);
    const porDia = {};
    todos.forEach(([,p])=>{
      const d = fmtDate(p.chegadaRecepcao);
      if(!porDia[d]) porDia[d]=[];
      porDia[d].push(p);
    });
    let html = `<div class="section-title">Resumo por Dia</div><div class="report-table">
      <div class="rt-header"><span>Data</span><span>Total</span><span>Concl.</span><span>Esp.Méd</span><span>Exam.Méd</span></div>`;
    Object.entries(porDia).sort((a,b)=>new Date(b[0].split("/").reverse().join("-"))-new Date(a[0].split("/").reverse().join("-")))
      .slice(0,30).forEach(([dia,list])=>{
        const c = list.filter(p=>p.saidaClinica&&!p.cancelado&&!p.desistiu);
        const me = calcMedia(c.map(p=>[null,p]),p=>diffMin(p.fimRecepcao,p.inicioExame));
        const mx = calcMedia(c.map(p=>[null,p]),p=>diffMin(p.inicioExame,p.fimExame));
        html+=`<div class="rt-row"><span>${dia}</span><span>${list.length}</span><span>${c.length}</span><span>${me!=null?me+"min":"—"}</span><span>${mx!=null?mx+"min":"—"}</span></div>`;
      });
    html += `</div>`;
    el.innerHTML = html;
  }
}

function calcMedia(list, fn){
  const vals = list.map(([,p])=>fn(p)).filter(v=>v!==null&&v>=0&&v<300);
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}

/* ══════════════════════════════════════════════════════════
   TELA DETALHE DO PACIENTE
══════════════════════════════════════════════════════════ */
function telaDetalhe({id, origem}){
  const p = pacientes[id];
  if(!p){ render(origem); return; }
  const app = document.getElementById("app");
  app.dataset.tela = "detalhe";

  const st = statusOf(p);
  const smeta = STATUS_META[st]||{l:"—",cor:"#6b7280"};
  const primeta = PRIORIDADES.find(x=>x.v===p.prioridade)||PRIORIDADES[0];

  const tEspera = diffMin(p.fimRecepcao, p.inicioExame);
  const tExame  = diffMin(p.inicioExame, p.fimExame);
  const tTotal  = diffMin(p.chegadaRecepcao, p.saidaClinica);

  const podeSala     = origem==="sala"     || origem==="supervisor" || origem==="admin";

      </div>

      <!-- Indicadores -->

        <div class="kpi-mini" style="border-color:${tEspera!=null?'#f59e0b44':'#1e2d47'}">
          <div class="kpi-val" style="color:${tEspera!=null?'#f59e0b':'#6b7280'}">${tEspera!=null?tEspera+"min":"—"}</div>
          <div class="kpi-lbl">Espera</div>
        </div>
        <div class="kpi-mini" style="border-color:${tExame!=null?'#3b82f644':'#1e2d47'}">
          <div class="kpi-val" style="color:${tExame!=null?'#3b82f6':'#6b7280'}">${tExame!=null?tExame+"min":"—"}</div>
          <div class="kpi-lbl">Exame</div>
        </div>
        <div class="kpi-mini" style="border-color:${tTotal!=null?'#10b98144':'#1e2d47'}">
          <div class="kpi-val" style="color:${tTotal!=null?'#10b981':'#6b7280'}">${tTotal!=null?tTotal+"min":"—"}</div>
          <div class="kpi-lbl">Total</div>
        </div>

      ${podeRecepcao ? `

        <div class="ts-section-title" style="color:#3b82f6">🟦 Recepção</div>

        ${tsReadOnly("fimRecepcao","Término",p)}

      <!-- TIMESTAMPS SALA -->

        ${tsBtn("fimExame","Término do exame",p,id,false,!encerrado&&!!p.inicioExame)}

      <!-- Eventos adversos -->
      <div class="ts-section">

        ${(p.adversos||[]).map(a=>`<div class="adverse-chip">⚠ ${a.tipo} <span style="color:#6b7280;margin-left:6px">${fmtTime(a.ts)}</span></div>`).join("")||"<div style='color:#6b7280;font-size:12px'>Nenhum evento registrado.</div>"}
        ${!encerrado?`

      </div>

      <!-- Satisfação -->
      ${p.saidaClinica&&!p.cancelado&&!p.desistiu?`

        <div class="ts-section-title" style="color:#f59e0b">⭐ Satisfação do Paciente</div>
        <div style="display:flex;gap:8px">
          ${[{v:1,e:"😞"},{v:2,e:"😐"},{v:3,e:"🙂"},{v:4,e:"😊"},{v:5,e:"🤩"}].map(({v,e})=>`
          <button data-sat="${v}" style="flex:1;padding:10px 0;border-radius:8px;font-size:22px;cursor:pointer;

  document.getElementById("btn-back").onclick = ()=> render(origem);

  // Satisfação
  document.querySelectorAll("[data-sat]").forEach(b=>{
    b.onclick = ()=>{
      update(ref(db,`pacientes/${id}`),{satisfacao:parseInt(b.dataset.sat)});

  // Eventos adversos

    const advsAtual = pacientes[id]?.adversos||[];
    update(ref(db,`pacientes/${id}`),{adversos:[...advsAtual,{tipo:sel.value,ts:nowISO()}]});
    sel.value="";
  };

  // Encerramento
  const btnD = document.getElementById("btn-desistiu");
  const btnC = document.getElementById("btn-cancelado");
  if(btnD) btnD.onclick = ()=>{
    const motivo = document.getElementById("motivo-enc").value;
    update(ref(db,`pacientes/${id}`),{desistiu:true,motivoCancelamento:motivo,saidaClinica:nowISO()});
  };
  if(btnC) btnC.onclick = ()=>{
    const motivo = document.getElementById("motivo-enc").value;
    update(ref(db,`pacientes/${id}`),{cancelado:true,motivoCancelamento:motivo,saidaClinica:nowISO()});
  };

  // Listener em tempo real para atualizar a tela
  onValue(ref(db,`pacientes/${id}`), snap=>{
    if(snap.val() && document.getElementById("btn-back")) telaDetalhe({id,origem});
  });
}

function tsBtn(campo, label, p, id, bloqueado, habilitado){
  const val = p[campo];
  const cor = val?"#10b981":"#a855f7";
  return `<button data-ts="${campo}" data-pid="${id}" class="ts-btn ${val?'ts-done':''} ${(!habilitado&&!val)?'ts-disabled':''}"
    style="border-color:${val?'#10b98144':habilitado?'#a855f744':'#1e2d47'};background:${val?'#10b98115':habilitado?'#a855f710':'transparent'}">
    <span class="ts-label">${label}</span>
    <span class="ts-time" style="color:${val?'#10b981':habilitado?'#a855f7':'#6b7280'}">${val?fmtTime(val):"Toque para registrar"}</span>
    ${val?`<span class="ts-check">✓ registrado</span>`:""}
  </button>`;
}

function tsReadOnly(campo, label, p){
  const val = p[campo];
  return `<div class="ts-btn ts-readonly" style="border-color:${val?'#3b82f644':'#1e2d47'};background:${val?'#3b82f610':'transparent'}">
    <span class="ts-label">${label}</span>
    <span class="ts-time" style="color:${val?'#3b82f6':'#6b7280'}">${val?fmtTime(val):"—"}</span>
  </div>`;
}

// Attach timestamp buttons (event delegation)
document.addEventListener("click", e=>{
  const btn = e.target.closest("[data-ts][data-pid]");
  if(!btn||btn.classList.contains("ts-disabled")||btn.classList.contains("ts-done")||btn.classList.contains("ts-readonly")) return;
  const campo = btn.dataset.ts;
  const pid   = btn.dataset.pid;
  const p     = pacientes[pid];
  if(!p) return;
  // Verificar pré-requisito
  const reqs = {
    inicioRecepcao:   null,
    fimRecepcao:      "inicioRecepcao",
    inicioExame:      "fimRecepcao",
    fimExame:         "inicioExame",
    saidaClinica:     "fimExame"
  };
  const req = reqs[campo];
  if(req && !p[req]){ alert(`Registre "${req}" antes.`); return; }
  if(p[campo]) return;
  const up = {};
  up[campo] = nowISO();
  up["operadorUltimo"] = currentUser.nome;
  update(ref(db,`pacientes/${pid}`), up);
});

          </div>
        </div>
      </div>`).join("");
  };

  onValue(ref(db,"usuarios"), snap=>{ Object.assign(usuarios,snap.val()||{}); renderUsers(); });
  renderUsers();

  document.getElementById("btn-criar-user").onclick = ()=>{
    const nome   = document.getElementById("nu-nome").value.trim();
    const user   = document.getElementById("nu-user").value.trim().toLowerCase();
    const pass   = document.getElementById("nu-pass").value;
    const perfil = document.getElementById("nu-perfil").value;
    const msg    = document.getElementById("user-msg");

    if(!nome||!user||!pass){ msg.style.display="block"; msg.style.color="#ef4444"; msg.textContent="Preencha todos os campos."; return; }
    if(pass.length<6){ msg.style.display="block"; msg.style.color="#ef4444"; msg.textContent="Senha mínima: 6 caracteres."; return; }

    document.getElementById("nu-nome").value="";
    document.getElementById("nu-user").value="";
    document.getElementById("nu-pass").value="";
  };
}

/* ══════════════════════════════════════════════════════════
   EXPORTAÇÃO CSV
══════════════════════════════════════════════════════════ */
function exportarCSV(){
  const headers = [
    "ID","Nome","Data","Exame","Prioridade","Convenio","Sala","Turno","Operador",
    "ChegadaRecepcao","InicioRecepcao","FimRecepcao","InicioExame","FimExame","SaidaClinica",
    "EsperaMin","ExameMin","TotalMin","Satisfacao","Adversos","Status","Motivo"
  ];
  const rows = Object.entries(pacientes).map(([id,p])=>[
    id, p.nome, fmtDate(p.chegadaRecepcao), p.exame, p.prioridade, p.convenio, p.sala||"", p.turno||"", p.operadorNome||"",
    p.chegadaRecepcao||"", p.inicioRecepcao||"", p.fimRecepcao||"",
    p.inicioExame||"", p.fimExame||"", p.saidaClinica||"",
    diffMin(p.fimRecepcao,p.inicioExame)??(""),
    diffMin(p.inicioExame,p.fimExame)??(""),
    diffMin(p.chegadaRecepcao,p.saidaClinica)??(""),
    p.satisfacao||"",
    (p.adversos||[]).map(a=>a.tipo).join("; "),
    statusOf(p),
    p.motivoCancelamento||""
  ]);
  const csv = [headers,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href=url; a.download=`cerdil_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function kpi(label,valor,cor){

    <div class="kpi-val" style="color:${cor}">${valor}</div>
    <div class="kpi-lbl">${label}</div>
  </div>`;
}
