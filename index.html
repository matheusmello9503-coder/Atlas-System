<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Atlas System</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07111f;
  --surface:#0d1e35;
  --card:#112240;
  --card2:#162d50;
  --border:#1e3a5f;
  --border2:#254d7a;
  --blue:#1e6fff;
  --blue2:#3d8bff;
  --blue3:#5ba3ff;
  --cyan:#00c8e0;
  --text:#e8f0fe;
  --text2:#a8c0e0;
  --text3:#5a7fa8;
  --success:#0ecb81;
  --success-bg:#062b1a;
  --warning:#f0a500;
  --warning-bg:#2a1f00;
  --danger:#f04040;
  --danger-bg:#2a0808;
  --purple:#9b6dff;
  --purple-bg:#1a0d38;
  --radius:12px;
  --shadow:0 4px 24px rgba(0,0,0,.35);
  --shadow-lg:0 8px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;font-size:16px}
#app{max-width:660px;margin:0 auto;min-height:100vh}

/* ── TOPBAR ── */
.topbar{display:flex;justify-content:space-between;align-items:center;
  padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;gap:10px;box-shadow:var(--shadow)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar-title{font-size:14px;font-weight:700;color:var(--blue2)}
.topbar-sub{font-size:11px;color:var(--text3)}

/* ── TABS ── */
.tabs-bar{display:flex;gap:2px;padding:10px 16px 0;background:var(--surface);border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px 4px;border:none;border-radius:8px 8px 0 0;font-family:inherit;
  font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--text3);transition:all .15s}
.tab.active{background:var(--card);color:var(--blue2);border-bottom:2px solid var(--blue)}

/* ── CONTENT ── */
.content{padding:18px;padding-bottom:90px}
.screen{display:flex;flex-direction:column;min-height:100vh}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(30,111,255,.12) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(0,200,224,.08) 0%, transparent 50%),
    linear-gradient(180deg,#07111f 0%,#0d1e35 100%)}
.login-card{width:100%;max-width:420px;background:var(--surface);
  border:1px solid var(--border2);border-radius:28px;
  padding:0;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(30,111,255,.1)}

.login-hero{
  background:linear-gradient(145deg,#0a1828 0%,#112240 60%,#162d50 100%);
  padding:44px 36px 36px;
  text-align:center;
  border-bottom:1px solid var(--border);
  position:relative;
  overflow:hidden}
.login-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 100%,rgba(30,111,255,.15) 0%,transparent 70%);
  pointer-events:none}
.login-hero-logo{
  display:flex;align-items:center;justify-content:center;gap:18px;
  margin-bottom:0;position:relative;z-index:1}
.login-hero-symbol{height:72px;width:auto;filter:drop-shadow(0 4px 24px rgba(30,111,255,.5))}
.login-hero-text{text-align:left}
.login-hero-name{
  font-size:38px;font-weight:900;line-height:1;letter-spacing:-1px;
  background:linear-gradient(135deg,#e8f0fe 0%,#3d8bff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-hero-name span{
  background:linear-gradient(135deg,#3d8bff 0%,#00c8e0 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-hero-tagline{
  font-size:13px;color:var(--text3);margin-top:5px;font-weight:500;letter-spacing:.5px}

.login-form{padding:32px 36px}
.login-divider{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.login-divider-line{flex:1;height:1px;background:var(--border)}
.login-divider-text{font-size:11px;color:var(--text3);font-weight:700;letter-spacing:1px;text-transform:uppercase}

/* ── FORMS ── */
.field-group{margin-bottom:16px}
.field-label{display:block;font-size:12px;font-weight:700;color:var(--text3);
  margin-bottom:6px;letter-spacing:.8px;text-transform:uppercase}
.field-input{width:100%;padding:13px 16px;border-radius:11px;background:var(--card2);
  border:1.5px solid var(--border);color:var(--text);font-size:15px;
  font-family:inherit;outline:none;transition:border-color .15s;appearance:none}
.field-input:focus{border-color:var(--blue);background:var(--card)}
.field-input option{background:var(--card);color:var(--text)}
textarea.field-input{resize:vertical;min-height:75px}

/* ── BUTTONS ── */
.btn-primary{padding:14px 22px;border-radius:11px;border:none;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);
  color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 20px rgba(30,111,255,.35);transition:opacity .15s;letter-spacing:.2px}
.btn-primary:hover{opacity:.88}
.btn-primary.full{width:100%}
.btn-accent{padding:10px 18px;border-radius:10px;border:1px solid var(--blue);
  background:rgba(30,111,255,.15);color:var(--blue2);font-weight:700;font-size:13px;
  cursor:pointer;font-family:inherit;transition:all .15s}
.btn-accent:hover{background:rgba(30,111,255,.28)}
.btn-ghost{padding:10px 16px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--text3);font-weight:600;font-size:13px;
  cursor:pointer;font-family:inherit;transition:all .15s}
.btn-ghost:hover{border-color:var(--blue2);color:var(--blue2)}
.btn-ghost.full{width:100%}
.btn-sm{padding:7px 14px;border-radius:8px;border:1px solid var(--border);
  background:var(--card2);color:var(--text2);font-weight:700;font-size:12px;
  cursor:pointer;font-family:inherit;transition:all .15s}
.btn-sm:hover{border-color:var(--blue2);color:var(--blue2)}
.btn-success{padding:15px 22px;border-radius:11px;border:none;width:100%;
  background:linear-gradient(135deg,var(--success) 0%,#0fa870 100%);
  color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;
  box-shadow:0 4px 20px rgba(14,203,129,.3);letter-spacing:.3px;margin-top:4px;transition:opacity .15s}
.btn-success:hover{opacity:.9}
.btn-success:disabled{opacity:.35;cursor:not-allowed}
.btn-back{padding:9px 16px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--text3);font-weight:700;font-size:14px;
  cursor:pointer;font-family:inherit}

/* ── CARDS ── */
.pac-card{background:var(--card);border:1px solid var(--border);
  border-left:4px solid var(--blue);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:10px;cursor:pointer;
  transition:box-shadow .15s,border-color .15s;box-shadow:var(--shadow)}
.pac-card:hover{border-color:var(--blue2);box-shadow:var(--shadow-lg)}
.pac-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pac-card-name{font-size:16px;font-weight:800;color:var(--text);margin-bottom:4px}
.pac-card-sub{font-size:13px;color:var(--text2);line-height:1.5}
.pac-card-time{font-size:12px;color:var(--text3);margin-top:5px;font-family:'IBM Plex Mono',monospace}

/* ── BADGES ── */
.badge{display:inline-block;padding:4px 11px;border-radius:20px;
  font-size:12px;font-weight:700;letter-spacing:.3px;
  border:1px solid var(--border);background:var(--card2);color:var(--text2)}

/* ── STATUS BAR ── */
.status-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.status-chip{padding:8px 14px;border-radius:10px;border:1px solid;
  font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:76px}
.status-count{font-size:22px;font-weight:900;line-height:1}
.status-lbl{font-size:9px;opacity:.8;text-align:center;line-height:1.3}

/* ── TIMESTAMPS ── */
.ts-section{background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.ts-section-title{font-size:12px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:6px;color:var(--text2)}
.ts-btn{display:flex;flex-direction:column;align-items:flex-start;padding:14px 18px;
  border-radius:11px;width:100%;background:var(--card2);
  border:1.5px solid var(--border);cursor:pointer;font-family:inherit;
  text-align:left;margin-bottom:9px;transition:all .2s}
.ts-btn:last-child{margin-bottom:0}
.ts-btn.ts-done{background:var(--success-bg);border-color:#0ecb8166}
.ts-btn.ts-disabled{opacity:.4;cursor:not-allowed}
.ts-btn.ts-readonly{cursor:default}
.ts-btn:not(.ts-disabled):not(.ts-done):not(.ts-readonly):hover{border-color:var(--blue2)}
.ts-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.ts-time{font-size:17px;font-weight:800;font-family:'IBM Plex Mono',monospace;color:var(--text);letter-spacing:.5px}
.ts-btn.ts-done .ts-time{color:var(--success)}
.ts-check{font-size:11px;color:var(--success);margin-top:4px;font-weight:700}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:440px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{padding:16px 10px;border-radius:12px;text-align:center;
  border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow)}
.kpi-mini{padding:14px 8px;border-radius:11px;text-align:center;border:1px solid var(--border);background:var(--card)}
.kpi-val{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--blue2)}
.kpi-lbl{font-size:11px;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-top:4px;font-weight:600}

/* ── DATE FILTER ── */
.date-filter{display:flex;gap:7px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px}
.date-btn{padding:9px 16px;border-radius:22px;border:1px solid var(--border);
  background:var(--card);color:var(--text3);font-size:12px;font-weight:700;
  cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;flex-shrink:0;line-height:1.4;text-align:center}
.date-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 14px rgba(30,111,255,.35)}

/* ── CHART ── */
.exam-chart{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.chart-row:last-child{margin-bottom:0}
.chart-label{font-size:12px;color:var(--text);width:155px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.chart-bar-wrap{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.chart-bar{height:100%;background:var(--blue);border-radius:4px;transition:width .5s}
.chart-val{font-size:13px;font-weight:800;color:var(--blue2);width:26px;text-align:right}

/* ── ADVERSE ── */
.adverse-chip{padding:9px 14px;border-radius:9px;background:var(--warning-bg);
  border:1px solid #f0a50033;font-size:13px;color:var(--text);
  margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}

/* ── PAC HEADER ── */
.pac-header{background:linear-gradient(135deg,var(--surface) 0%,var(--card2) 100%);
  border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:18px}
.pac-name{font-size:22px;font-weight:900;color:var(--text);margin-bottom:5px}
.pac-meta{font-size:13px;color:var(--text2);margin-bottom:3px;line-height:1.5}
.pac-id{font-size:11px;color:var(--text3);font-family:'IBM Plex Mono',monospace;margin-top:5px}

/* ── SECTION ── */
.section-title{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text3);margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--border)}
.list-header{font-size:13px;font-weight:800;color:var(--text3);letter-spacing:.6px;
  text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.list-subheader{font-size:12px;font-weight:800;color:var(--text3);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ordem-num{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;min-width:22px;border-radius:50%;background:var(--card2);
  border:1px solid var(--border2);color:var(--text2);font-size:12px;font-weight:800;
  margin-right:8px;font-family:'IBM Plex Mono',monospace;vertical-align:middle}

/* ── MODAL ── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);
  z-index:1000;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.modal-card{background:var(--surface);border:1px solid var(--border2);
  border-radius:24px 24px 0 0;padding:26px 24px;width:100%;
  max-width:660px;max-height:93vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-handle{width:44px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 22px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.modal-title{font-size:18px;font-weight:800;color:var(--text)}

/* ── EXAME SELECT ── */
.exame-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-height:270px;overflow-y:auto;padding-right:4px}
.exame-chip{padding:10px 11px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--card2);font-size:13px;font-weight:600;color:var(--text2);
  cursor:pointer;transition:all .15s;text-align:left;font-family:inherit;line-height:1.3}
.exame-chip:hover{border-color:var(--blue2);color:var(--blue2)}
.exame-chip.selected{border-color:var(--blue);background:rgba(30,111,255,.15);color:var(--blue2);font-weight:800}
.exame-sel-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;min-height:26px}
.exame-tag{padding:5px 11px;border-radius:20px;background:var(--blue);
  color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.exame-tag-rm{cursor:pointer;opacity:.7;font-size:15px;line-height:1}

/* ── STATUS ATENDIMENTO ── */
.status-atend-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.status-atend-btn{padding:16px;border-radius:11px;border:2px solid var(--border);
  background:var(--card2);cursor:pointer;font-family:inherit;font-size:14px;
  font-weight:800;color:var(--text2);transition:all .2s;text-align:center}
.status-atend-btn.sel-concluido{border-color:var(--success);background:var(--success-bg);color:var(--success)}
.status-atend-btn.sel-cancelado{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}

/* ── PRIO ── */
.prio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.prio-btn{padding:10px 6px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--card2);cursor:pointer;font-family:inherit;font-size:12px;
  font-weight:700;color:var(--text3);transition:all .2s;text-align:center}

/* ── REPORT ── */
.report-table{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.rt-header{display:grid;grid-template-columns:1fr .8fr .7fr .9fr .9fr .9fr;
  gap:6px;padding:11px 16px;font-size:11px;background:var(--card2);
  color:var(--text3);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.rt-row{display:grid;grid-template-columns:1fr .8fr .7fr .9fr .9fr .9fr;
  gap:6px;padding:11px 16px;font-size:13px;border-top:1px solid var(--border);color:var(--text)}
.rt-row:hover{background:var(--card2)}

/* ── ADMIN ── */
.admin-user-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px 18px;margin-bottom:9px;box-shadow:var(--shadow)}

/* ── PROCESSO (sala) ── */
.processo-card{background:var(--card);border:1px solid var(--border2);
  border-radius:12px;padding:13px 16px;margin-bottom:8px;border-left:4px solid var(--warning)}
.processo-name{font-size:15px;font-weight:700;color:var(--text2)}
.processo-sub{font-size:12px;color:var(--text3);margin-top:3px}

/* ── INFO BOX ── */
.info-box{background:var(--card2);border:1px solid var(--border);border-radius:10px;
  padding:11px 15px;font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.5}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:56px 24px;color:var(--text3);font-size:15px;
  background:var(--card);border:1px dashed var(--border);border-radius:14px;line-height:2}

/* ── ERROR ── */
.error-msg{font-size:13px;color:var(--danger);padding:10px 14px;
  background:var(--danger-bg);border-radius:10px;margin-bottom:12px;
  border:1px solid #f0404022;font-weight:600}

/* ── PERFIL SELECT ── */
.perfil-btn{padding:18px;border-radius:13px;border:2px solid var(--border);
  background:var(--card);cursor:pointer;font-family:inherit;font-size:16px;
  font-weight:800;color:var(--text2);transition:all .2s;text-align:center;width:100%;margin-bottom:10px}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── DASHBOARD (Supervisor/Admin em telas largas) ── */
#app[data-tela="supervisor"],#app[data-tela="admin"]{max-width:1180px}
.dash-shell{display:flex;align-items:flex-start}
.dash-sidebar{width:214px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);padding:18px 12px;
  position:sticky;top:61px;height:calc(100vh - 61px);overflow-y:auto}
.dash-nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-radius:10px;color:var(--text3);font-weight:700;font-size:14px;
  cursor:pointer;margin-bottom:4px;border:none;background:transparent;
  width:100%;text-align:left;font-family:inherit;transition:all .15s}
.dash-nav-item:hover{background:var(--card2);color:var(--text2)}
.dash-nav-item.active{background:rgba(30,111,255,.15);color:var(--blue2)}
.dash-main{flex:1;min-width:0}
.dash-main .content{padding:22px 26px}
.btn-lbl{display:none}
.admin-grid{display:block}
@media(min-width:640px){
  .btn-lbl{display:inline;margin-left:2px}
}
@media(max-width:860px){
  .dash-sidebar{display:none}
}
@media(min-width:861px){
  #app[data-tela="supervisor"] .tabs-bar{display:none}
  .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
}
</style>

const nowISO  = () => new Date().toISOString();
const fmtTime = iso => iso ? new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}) : "—";
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString("pt-BR") : "—";
const diffMin = (a,b) => { if(!a||!b) return null; const d=Math.round((new Date(b)-new Date(a))/60000); return d<0?0:d; };
const todayStr = () => fmtDate(new Date().toISOString());
const horaTurno = () => { const h=new Date().getHours(); if(h<12)return"Manhã"; if(h<18)return"Tarde"; return"Noite"; };
function dateStrFromOffset(off){ const d=new Date(); d.setDate(d.getDate()-off); return fmtDate(d.toISOString()); }
function labelFromOffset(off){ return ["Hoje","Ontem","2 dias atrás","3 dias atrás","4 dias atrás"][off]||`${off} dias atrás`; }

/* ══ STATUS — fimExame NÃO encerra mais automaticamente ══ */
function statusOf(p){
  if(p.statusAtendimento==="cancelado") return "cancelado";
  if(p.statusAtendimento==="concluido") return "concluido";
  if(p.fimExame)        return "aguard_finalizar";
  if(p.inicioExame)     return "em_exame";
  if(p.fimRecepcao)     return "aguardando_exame";
  if(p.inicioRecepcao)  return "na_recepcao";
  return "chegou";
}

/* ══ ROTEADOR ══ */
function render(tela,dados={}){
  const el=document.getElementById("app");
  el.innerHTML=""; el.dataset.tela=tela;

}

function iniciarListeners(){
  if(listenersOn) return; listenersOn=true;
  onValue(ref(db,"pacientes"),snap=>{ pacientes=snap.val()||{}; atualizarConteudo(); });
  onValue(ref(db,"usuarios"), snap=>{ usuarios=snap.val()||{}; });
}

function pararListeners(){
  off(ref(db,"pacientes"));
  off(ref(db,"usuarios"));
  listenersOn=false;
}

function atualizarConteudo(){
  const tela=document.getElementById("app")?.dataset?.tela;

  if(tela==="supervisor") conteudoSupervisor(tabAtiva);

function _mostrarLogin(erroInicial){
  const app=document.getElementById("app");
  app.dataset.tela="login";
  app.innerHTML=`
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-hero">

        </div>
      </div>
      <div class="login-form">
        <div class="login-divider">
          <div class="login-divider-line"></div>
          <div class="login-divider-text">Acesso</div>
          <div class="login-divider-line"></div>
        </div>
        <div class="field-group">
          <label class="field-label">Usuário</label>
          <input id="l-user" class="field-input" placeholder="seu.usuario" autocomplete="off" autocorrect="off" autocapitalize="off"/>
        </div>
        <div class="field-group">
          <label class="field-label">Senha</label>
          <input id="l-pass" class="field-input" type="password" placeholder="••••••••"/>
        </div>
        <div id="l-err" class="error-msg" style="display:${erroInicial?"block":"none"}">${erroInicial||""}</div>
        <button class="btn-primary full" id="l-btn">Entrar</button>
      </div>
    </div>
  </div>`;

  const doLogin=async()=>{
    const u=document.getElementById("l-user").value.trim().toLowerCase();
    const p=document.getElementById("l-pass").value;
    const err=document.getElementById("l-err");
    const btn=document.getElementById("l-btn");
    if(!u||!p){ err.style.display="block"; err.textContent="Preencha usuário e senha."; return; }
    err.style.display="none";
    btn.disabled=true; btn.textContent="Entrando...";
    try{
      await signInWithEmailAndPassword(auth, emailDoUsuario(u), p);
      /* onAuthStateChanged cuida do redirecionamento a partir daqui */
    }catch(e){
      btn.disabled=false; btn.textContent="Entrar";
      err.style.display="block";
      err.textContent = ["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"].includes(e.code)
        ? "Usuário ou senha incorretos."
        : "Erro ao entrar. Verifique sua conexão com a internet.";
    }
  };
  document.getElementById("l-btn").onclick=doLogin;
  document.getElementById("l-pass").onkeydown=e=>{ if(e.key==="Enter") doLogin(); };
}

/* ── Modal: alterar a própria senha (self-service, sem depender do admin) ── */
function abrirModalSenha(){
  const ov=document.getElementById("modal-overlay");
  if(!ov) return;
  ov.style.display="flex";
  ov.innerHTML=`
  <div class="modal-card">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">Alterar minha senha</div>
      <button id="ms-x" style="background:none;border:none;color:var(--text3);font-size:26px;cursor:pointer;line-height:1">×</button>
    </div>
    <div class="field-group">
      <label class="field-label">Senha atual</label>
      <input id="ms-atual" class="field-input" type="password" autocomplete="off"/>
    </div>
    <div class="field-group">
      <label class="field-label">Nova senha</label>
      <input id="ms-nova" class="field-input" type="password" placeholder="Mínimo 6 caracteres" autocomplete="off"/>
    </div>
    <div id="ms-err" class="error-msg" style="display:none"></div>
    <button class="btn-primary full" id="ms-salvar">Salvar nova senha</button>
  </div>`;
  const fechar=()=>{ ov.style.display="none"; ov.innerHTML=""; };
  document.getElementById("ms-x").onclick=fechar;
  document.getElementById("ms-salvar").onclick=async()=>{
    const atual=document.getElementById("ms-atual").value;
    const nova=document.getElementById("ms-nova").value;
    const err=document.getElementById("ms-err");
    if(!atual||nova.length<6){ err.style.display="block"; err.textContent="Preencha a senha atual e uma nova com no mínimo 6 caracteres."; return; }
    try{
      const cred=EmailAuthProvider.credential(auth.currentUser.email,atual);
      await reauthenticateWithCredential(auth.currentUser,cred);
      await updatePassword(auth.currentUser,nova);
      fechar();
      alert("Senha alterada com sucesso!");
    }catch(e){
      err.style.display="block";
      err.textContent = e.code==="auth/wrong-password" ? "Senha atual incorreta." : "Erro ao alterar a senha. Tente novamente.";
    }
  };
}

/* ── Filtro de data ── */
function dateFilterHTML(){
  return `<div class="date-filter">
    ${[0,1,2,3,4].map(i=>`<button class="date-btn${dataSel===dateStrFromOffset(i)?" active":""}" data-off="${i}">

    </button>`).join("")}
  </div>`;
}
function bindDateFilter(){
  document.querySelectorAll(".date-btn[data-off]").forEach(b=>{
    b.onclick=()=>{ dataSel=dateStrFromOffset(parseInt(b.dataset.off)); atualizarConteudo(); };
  });
}

/* ── Filtro de status (Ativos / Concluídos / Cancelados / Todos) ── */
const STATUS_FILTROS = [
  {v:"ativos",     l:"Ativos"},
  {v:"concluidos", l:"Concluídos"},
  {v:"cancelados", l:"Cancelados"},
  {v:"todos",      l:"Todos"}
];
function statusFilterHTML(){
  return `<div style="margin-bottom:16px">
    <div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px">Status</div>
    <div class="date-filter" style="margin-bottom:0">
      ${STATUS_FILTROS.map(f=>`<button class="date-btn${filtroStatus===f.v?" active":""}" data-sf="${f.v}">${f.l}</button>`).join("")}
    </div>
  </div>`;
}
function bindStatusFilter(onChange){
  document.querySelectorAll(".date-btn[data-sf]").forEach(b=>{
    b.onclick=()=>{ filtroStatus=b.dataset.sf; onChange(); };
  });
}
function aplicarFiltroStatus(lista){
  if(filtroStatus==="concluidos") return lista.filter(([,p])=>p.statusAtendimento==="concluido");
  if(filtroStatus==="cancelados") return lista.filter(([,p])=>p.statusAtendimento==="cancelado");
  if(filtroStatus==="todos") return lista;
  return lista.filter(([,p])=>!p.statusAtendimento); /* ativos */
}

function pacientesDoDia(d){ return Object.entries(pacientes).filter(([,p])=>fmtDate(p.chegadaRecepcao)===d).sort((a,b)=>new Date(a[1].chegadaRecepcao)-new Date(b[1].chegadaRecepcao)); }

/* ══ RECEPÇÃO ══ */
function telaRecepcao(){
  document.getElementById("app").innerHTML=`
  <div class="screen">
    ${topbarHTML("🟦 Recepção","#1e6fff",`<button class="btn-accent" id="btn-novo">+ Novo</button>`)}
    <div class="content" id="content-recepcao"></div>
  </div>
  <div id="modal-overlay"></div>`;
  bindTopbar();
  document.getElementById("btn-novo")?.addEventListener("click",()=>modalNovoPaciente());
  conteudoRecepcao();
}

function conteudoRecepcao(){
  const el=document.getElementById("content-recepcao");
  if(!el) return;
  const lista=pacientesDoDia(dataSel);
  const filtrada=aplicarFiltroStatus(lista);

  let html=dateFilterHTML()+statusFilterHTML()+statusBarHTML(lista);
  if(!lista.length){
    html+=`<div class="empty-state">Nenhum paciente em ${dataSel}.</div>`;
  }else if(!filtrada.length){
    html+=`<div class="empty-state">Nenhum registro nesse filtro de status.</div>`;
  }else if(filtroStatus==="ativos"){
    const prioritarios=filtrada.filter(([,p])=>p.prioridade!=="normal")
      .sort((a,b)=>new Date(a[1].chegadaRecepcao)-new Date(b[1].chegadaRecepcao));
    const normais=filtrada.filter(([,p])=>p.prioridade==="normal")
      .sort((a,b)=>new Date(a[1].chegadaRecepcao)-new Date(b[1].chegadaRecepcao));
    let n=0;
    html+=`<div class="list-header">Ativos (${filtrada.length}) · ordem de chamada</div>`;
    if(prioritarios.length){
      html+=`<div class="list-subheader" style="color:var(--warning)">🔶 Prioridade (${prioritarios.length})</div>`;
      prioritarios.forEach(([id,p])=>{ n++; html+=cardHTML(id,p,n); });
    }
    if(normais.length){
      html+=`<div class="list-subheader" style="margin-top:${prioritarios.length?"16px":"0"}">➜ Ordem de chegada (${normais.length})</div>`;
      normais.forEach(([id,p])=>{ n++; html+=cardHTML(id,p,n); });
    }
  }else{
    const lbl=STATUS_FILTROS.find(f=>f.v===filtroStatus)?.l||"Registros";
    html+=`<div class="list-header">${lbl} (${filtrada.length})</div>`;
    [...filtrada].sort((a,b)=>new Date(b[1].chegadaRecepcao)-new Date(a[1].chegadaRecepcao)).forEach(([id,p])=>html+=cardHTML(id,p));
  }
  el.innerHTML=html; bindDateFilter(); bindStatusFilter(conteudoRecepcao);
  el.querySelectorAll("[data-pid]").forEach(c=>c.onclick=()=>render("detalhe",{id:c.dataset.pid,origem:"recepcao"}));
}

/* ══ SALA ══ */
function telaSala(){

function conteudoSala(){
  const el=document.getElementById("content-sala");
  if(!el) return;
  const lista=pacientesDoDia(dataSel);

  let html=dateFilterHTML()+statusFilterHTML()+statusBarHTML(lista);

  if(filtroStatus==="ativos"){
    const naRec=lista.filter(([,p])=>!p.fimRecepcao&&!p.statusAtendimento);
    const filaSala=lista.filter(([,p])=>p.fimRecepcao&&!p.statusAtendimento);
    const emExame=filaSala.filter(([,p])=>p.inicioExame&&!p.fimExame);
    const aguardExame=filaSala.filter(([,p])=>!p.inicioExame);
    const aguardFinal=filaSala.filter(([,p])=>p.fimExame);

    if(naRec.length){
      html+=`<div class="list-header" style="color:var(--warning)">⏳ Em processo na Recepção (${naRec.length})</div>`;
      naRec.forEach(([,p])=>{
        const pm=PRIORIDADES.find(x=>x.v===p.prioridade)||PRIORIDADES[0];
        html+=`<div class="processo-card"><div class="processo-name">${p.nome}</div>
          <div class="processo-sub">Chegou: ${fmtTime(p.chegadaRecepcao)} · ${pm.l} · ${p.convenio||""}</div></div>`;
      });
    }
    if(aguardExame.length){
      html+=`<div class="list-header" style="color:var(--purple);margin-top:${naRec.length?'22px':'0'}">🟣 Aguardando Exame (${aguardExame.length}) · ordem de chamada</div>`;
      const prioritariosEx=aguardExame.filter(([,p])=>p.prioridade!=="normal")
        .sort((a,b)=>new Date(a[1].chegadaRecepcao)-new Date(b[1].chegadaRecepcao));
      const normaisEx=aguardExame.filter(([,p])=>p.prioridade==="normal")
        .sort((a,b)=>new Date(a[1].chegadaRecepcao)-new Date(b[1].chegadaRecepcao));
      let nEx=0;
      if(prioritariosEx.length){
        html+=`<div class="list-subheader" style="color:var(--warning)">🔶 Prioridade (${prioritariosEx.length})</div>`;
        prioritariosEx.forEach(([id,p])=>{ nEx++; html+=cardHTML(id,p,nEx); });
      }
      if(normaisEx.length){
        html+=`<div class="list-subheader" style="margin-top:${prioritariosEx.length?"16px":"0"}">➜ Ordem de chegada (${normaisEx.length})</div>`;
        normaisEx.forEach(([id,p])=>{ nEx++; html+=cardHTML(id,p,nEx); });
      }
    }
    if(emExame.length){
      html+=`<div class="list-header" style="color:var(--success);margin-top:22px">🟢 Em Exame (${emExame.length})</div>`;
      emExame.forEach(([id,p])=>html+=cardHTML(id,p));
    }
    if(aguardFinal.length){
      html+=`<div class="list-header" style="color:var(--cyan);margin-top:22px">🔵 Aguardando Finalização (${aguardFinal.length})</div>`;
      aguardFinal.forEach(([id,p])=>html+=cardHTML(id,p));
    }
    if(!lista.length){
      html+=`<div class="empty-state">Nenhum paciente em ${dataSel}.</div>`;
    }else if(!naRec.length&&!aguardExame.length&&!emExame.length&&!aguardFinal.length){
      html+=`<div class="empty-state">Nenhum paciente ativo em ${dataSel}.</div>`;
    }
  }else{
    const filtrada=aplicarFiltroStatus(lista);
    if(!filtrada.length){
      html+=`<div class="empty-state">Nenhum registro nesse filtro de status.</div>`;
    }else{
      const lbl=STATUS_FILTROS.find(f=>f.v===filtroStatus)?.l||"Registros";
      html+=`<div class="list-header">${lbl} (${filtrada.length})</div>`;
      [...filtrada].sort((a,b)=>new Date(b[1].chegadaRecepcao)-new Date(a[1].chegadaRecepcao)).forEach(([id,p])=>html+=cardHTML(id,p));
    }
  }

  el.innerHTML=html; bindDateFilter(); bindStatusFilter(conteudoSala);
  el.querySelectorAll("[data-pid]").forEach(c=>c.onclick=()=>render("detalhe",{id:c.dataset.pid,origem:"sala"}));
}

function conteudoSupervisor(aba="painel"){
  tabAtiva=aba;
  const el=document.getElementById("content-supervisor");
  if(!el) return;
  const lista=pacientesDoDia(dataSel);
  const conc=lista.filter(([,p])=>p.statusAtendimento==="concluido");

  if(aba==="painel"){
    const ativos=lista.filter(([,p])=>!p.statusAtendimento);
    const canc=lista.filter(([,p])=>p.statusAtendimento==="cancelado");
    const me=calcMedia(conc,p=>diffMin(p.fimRecepcao,p.inicioExame));
    const mx=calcMedia(conc,p=>diffMin(p.inicioExame,p.fimExame));
    const mt=calcMedia(conc,p=>diffMin(p.chegadaRecepcao,p.fimExame));

    let html=dateFilterHTML()+statusBarHTML(lista);
    html+=`<div class="kpi-grid" style="margin-bottom:10px">
      ${kpi("Total",lista.length,"var(--blue2)")}
      ${kpi("Concluídos",conc.length,"var(--success)")}
      ${kpi("Ativos",ativos.length,"var(--warning)")}
      ${kpi("Cancelados",canc.length,"var(--danger)")}
    </div>
    <div class="kpi-grid" style="margin-bottom:18px">
      ${kpi("Esp. Média",me!=null?me+"min":"—","var(--warning)")}
      ${kpi("Exame Médio",mx!=null?mx+"min":"—","var(--blue2)")}
      ${kpi("T. Total",mt!=null?mt+"min":"—","var(--success)")}
      ${kpi("T. p/Paciente",mt!=null?mt+"min":"—","var(--cyan)")}
    </div>`;

    const tC={};
    lista.forEach(([,p])=>{ (Array.isArray(p.exames)?p.exames:[p.exame]).filter(Boolean).forEach(e=>{ tC[e]=(tC[e]||0)+1; }); });
    const maxT=Math.max(...Object.values(tC),1);
    if(Object.keys(tC).length){
      html+=`<div class="section-title">Exames do Dia</div><div class="exam-chart">`;
      Object.entries(tC).sort((a,b)=>b[1]-a[1]).forEach(([tipo,cnt])=>{
        html+=`<div class="chart-row"><div class="chart-label">${tipo}</div>
          <div class="chart-bar-wrap"><div class="chart-bar" style="width:${Math.round(cnt/maxT*100)}%"></div></div>
          <div class="chart-val">${cnt}</div></div>`;
      });
      html+=`</div>`;
    }
    const advs=lista.flatMap(([,p])=>(p.adversos||[]).map(a=>({...a,pn:p.nome})));
    if(advs.length){
      html+=`<div class="section-title" style="margin-top:18px">⚠ Eventos Adversos</div>`;
      advs.forEach(a=>html+=`<div class="adverse-chip">⚠ ${a.tipo}<span style="color:var(--text3);margin-left:8px;font-size:12px">${a.pn} · ${fmtTime(a.ts)}</span></div>`);
    }
    el.innerHTML=html; bindDateFilter();

  } else if(aba==="todos"){
    const filtrada=aplicarFiltroStatus(lista);
    let html=dateFilterHTML()+statusFilterHTML()+`<div class="section-title">${filtrada.length} registros em ${dataSel}</div>`;
    if(!filtrada.length) html+=`<div class="empty-state">Nenhum registro nesse filtro de status.</div>`;
    [...filtrada].sort((a,b)=>new Date(b[1].chegadaRecepcao)-new Date(a[1].chegadaRecepcao)).forEach(([id,p])=>html+=cardHTML(id,p));
    el.innerHTML=html; bindDateFilter(); bindStatusFilter(()=>conteudoSupervisor("todos"));
    el.querySelectorAll("[data-pid]").forEach(c=>c.onclick=()=>render("detalhe",{id:c.dataset.pid,origem:"supervisor"}));

  } else if(aba==="relatorio"){
    const todos=Object.entries(pacientes);
    const porDia={};
    todos.forEach(([,p])=>{ const d=fmtDate(p.chegadaRecepcao); if(!porDia[d])porDia[d]=[]; porDia[d].push(p); });
    let html=`<div class="section-title">Resumo por Dia</div><div class="report-table">
      <div class="rt-header"><span>Data</span><span>Total</span><span>Concl.</span><span>Esp.Méd</span><span>Ex.Méd</span><span>T.Pac</span></div>`;
    Object.entries(porDia).sort((a,b)=>new Date(b[0].split("/").reverse().join("-"))-new Date(a[0].split("/").reverse().join("-"))).slice(0,60).forEach(([dia,list])=>{
      const c=list.filter(p=>p.statusAtendimento==="concluido");
      const me=calcMedia(c.map(p=>[null,p]),p=>diffMin(p.fimRecepcao,p.inicioExame));
      const mx=calcMedia(c.map(p=>[null,p]),p=>diffMin(p.inicioExame,p.fimExame));
      const mp=calcMedia(c.map(p=>[null,p]),p=>diffMin(p.chegadaRecepcao,p.fimExame));
      const canc=list.filter(p=>p.statusAtendimento==="cancelado").length;
      html+=`<div class="rt-row"><span>${dia}</span><span>${list.length}</span>
        <span>${c.length}${canc?` <span style="color:var(--danger);font-size:10px">(${canc}✕)</span>`:""}</span>
        <span>${me!=null?me+"m":"—"}</span><span>${mx!=null?mx+"m":"—"}</span>
        <span style="color:var(--cyan)">${mp!=null?mp+"m":"—"}</span></div>`;
    });
    html+=`</div>`;

    const priC={};
    todos.forEach(([,p])=>{ priC[p.prioridade]=(priC[p.prioridade]||0)+1; });
    if(Object.keys(priC).length){
      html+=`<div class="section-title" style="margin-top:22px">Distribuição por Prioridade</div><div class="exam-chart">`;
      const maxP=Math.max(...Object.values(priC),1);
      PRIORIDADES.forEach(pr=>{ if(priC[pr.v]) html+=`<div class="chart-row">
        <div class="chart-label" style="color:${pr.cor}">${pr.l}</div>
        <div class="chart-bar-wrap"><div class="chart-bar" style="width:${Math.round(priC[pr.v]/maxP*100)}%;background:${pr.cor}"></div></div>
        <div class="chart-val" style="color:${pr.cor}">${priC[pr.v]}</div></div>`; });
      html+=`</div>`;
    }
    const convC={};
    todos.forEach(([,p])=>{ if(p.convenio) convC[p.convenio]=(convC[p.convenio]||0)+1; });
    if(Object.keys(convC).length){
      const maxC=Math.max(...Object.values(convC),1);
      html+=`<div class="section-title" style="margin-top:22px">Distribuição por Convênio</div><div class="exam-chart">`;
      Object.entries(convC).sort((a,b)=>b[1]-a[1]).forEach(([cv,cnt])=>{
        html+=`<div class="chart-row"><div class="chart-label">${cv}</div>
          <div class="chart-bar-wrap"><div class="chart-bar" style="width:${Math.round(cnt/maxC*100)}%"></div></div>
          <div class="chart-val">${cnt}</div></div>`;
      });
      html+=`</div>`;
    }
    el.innerHTML=html;
  }
}

          ${tsBtnHTML("inicioRecepcao","Início do atendimento",p,id,false,!encerrado)}

          ${tsBtnHTML("fimExame","Término do exame",p,id,false,!encerrado&&!!p.inicioExame)}

        <div class="ts-section-title">📋 Status do Atendimento</div>

          ${p.statusAtendimento==="concluido"?"✓ Concluído":"✕ Cancelado"}
        </div>
        ${p.fimExame?`<div style="font-size:13px;color:var(--text3);margin-top:6px">Finalizado às ${fmtTime(p.fimExame)}</div>`:""}
      </div>`}

    </div>
  </div>
  <div id="modal-overlay"></div>`;

  document.getElementById("btn-back").onclick=()=>render(origem);

  document.getElementById("btn-adv")?.addEventListener("click",()=>{
    const sel=document.getElementById("sel-adv");
    if(!sel.value) return;
    const atual=pacientes[id]?.adversos||[];
    update(ref(db,`pacientes/${id}`),{adversos:[...atual,{tipo:sel.value,ts:nowISO()}]});
    sel.value="";
  });

  document.getElementById("btn-obs")?.addEventListener("click",()=>{
    update(ref(db,`pacientes/${id}`),{obs:document.getElementById("obs-inp").value});
  });

  let statusSel=null;
  document.querySelectorAll("[data-st]").forEach(b=>{

      if(statusSel==="concluido"){ msg.style.background="var(--success-bg)"; msg.style.color="var(--success)"; msg.textContent="✓ Concluído — clique em Finalizar para confirmar."; }
      else{ msg.style.background="var(--danger-bg)"; msg.style.color="var(--danger)"; msg.textContent="✕ Cancelado — clique em Finalizar para confirmar."; }
      const fb=document.getElementById("btn-finalizar");
      fb.disabled=false;
      if(statusSel==="cancelado"){ fb.style.background="var(--danger)"; fb.style.boxShadow="0 4px 20px rgba(240,64,64,.3)"; }
      else{ fb.style.background=""; fb.style.boxShadow=""; }
    };
  });

  document.getElementById("btn-finalizar")?.addEventListener("click",()=>{
    if(!statusSel) return;
    const obs=document.getElementById("obs-inp")?.value||p.obs||"";
    update(ref(db,`pacientes/${id}`),{
      statusAtendimento: statusSel,
      obs,
      fimExame: p.fimExame||nowISO()
    });
  });
}

/* ── TS Buttons ── */
function tsBtnHTML(campo,label,p,id,bloq,hab){
  const val=p[campo];
  return `<button data-ts="${campo}" data-pid="${id}"
    class="ts-btn${val?" ts-done":""}${(!hab&&!val&&!bloq)?" ts-disabled":""}${bloq?" ts-disabled ts-readonly":""}">
    <span class="ts-label">${label}</span>
    <span class="ts-time">${val?fmtTime(val):"Toque para registrar"}</span>
    ${val?`<span class="ts-check">✓ registrado às ${fmtTime(val)}</span>`:""}
  </button>`;
}
function tsRoHTML(campo,label,p){
  const val=p[campo];
  return `<div class="ts-btn ts-readonly${val?" ts-done":""}">
    <span class="ts-label">${label}</span>
    <span class="ts-time">${val?fmtTime(val):"—"}</span>
  </div>`;
}

document.addEventListener("click",e=>{
  const btn=e.target.closest("[data-ts][data-pid]");
  if(!btn||btn.classList.contains("ts-disabled")||btn.classList.contains("ts-done")||btn.classList.contains("ts-readonly")) return;
  const campo=btn.dataset.ts,pid=btn.dataset.pid,p=pacientes[pid];
  if(!p||p[campo]) return;
  const reqs={fimRecepcao:"inicioRecepcao",inicioExame:"fimRecepcao",fimExame:"inicioExame"};
  const req=reqs[campo];
  if(req&&!p[req]){ alert("Registre o campo anterior primeiro."); return; }
  const up={}; up[campo]=nowISO(); up.operadorUltimo=currentUser?.nome||"";
  update(ref(db,`pacientes/${pid}`),up);
});

  if(!el) return;
  if(cnt) cnt.textContent=examesSel.length?`(${examesSel.length} selecionado${examesSel.length>1?"s":""})`:""
  el.innerHTML=examesSel.map(e=>`<div class="exame-tag">${e.replace("US ","")}<span class="exame-tag-rm" data-rem="${e}">×</span></div>`).join("");
  el.querySelectorAll("[data-rem]").forEach(r=>{
    r.onclick=()=>{ const ex=r.dataset.rem; examesSel=examesSel.filter(x=>x!==ex); document.querySelector(`.exame-chip[data-ex="${ex}"]`)?.classList.remove("selected"); atualizarTagsEx(); };
  });
}

/* ══ ADMIN ══ */
function telaAdmin(){
  document.getElementById("app").innerHTML=`

      <button class="btn-back" id="btn-back-adm">← Voltar</button>

        <div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">

              </div>
              <div id="pfsel" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:9px"></div>

          </div>
          <div class="info-box" style="margin-top:18px">

            pessoa diretamente pelo app. Cada operador pode trocar a própria senha pelo botão 🔑 no topo da tela.
            Se realmente perdeu o acesso, desative a conta antiga aqui e crie uma nova para essa pessoa.
          </div>
        </div>
      </div>
    </div>
  </div>`;

  document.getElementById("btn-back-adm").onclick=()=>render("supervisor");
  let perfisSel=[];
  document.querySelectorAll("[data-perfil]").forEach(b=>{
    b.onclick=()=>{
      const pf=b.dataset.perfil;
      if(perfisSel.includes(pf)){ perfisSel=perfisSel.filter(x=>x!==pf); b.style.borderColor="var(--border)"; b.style.background="var(--card2)"; b.style.color="var(--text3)"; }
      else{ perfisSel.push(pf); b.style.borderColor="var(--blue)"; b.style.background="rgba(30,111,255,.15)"; b.style.color="var(--blue2)"; }
      document.getElementById("pfsel").innerHTML=perfisSel.map(p=>`<div class="exame-tag">${PERFIS[p]||p}</div>`).join("");
    };
  });
  onValue(ref(db,"usuarios"),snap=>{ usuarios=snap.val()||{}; renderUsers(); });

  document.getElementById("btn-criar").onclick=async()=>{
    const nome=document.getElementById("nu-nome").value.trim();
    const user=document.getElementById("nu-user").value.trim().toLowerCase();
    const pass=document.getElementById("nu-pass").value;
    const msg=document.getElementById("usr-msg");
    const btn=document.getElementById("btn-criar");
    if(!nome||!user||!pass||!perfisSel.length){ msg.style.display="block"; msg.style.color="var(--danger)"; msg.textContent="Preencha todos os campos e selecione ao menos 1 perfil."; return; }
    if(pass.length<6){ msg.style.display="block"; msg.style.color="var(--danger)"; msg.textContent="Senha mínima: 6 caracteres."; return; }
    if(!/^[a-z0-9._-]+$/.test(user)){ msg.style.display="block"; msg.style.color="var(--danger)"; msg.textContent="Usuário só pode ter letras minúsculas, números, ponto, hífen ou underline (sem espaços/acentos)."; return; }

      document.querySelectorAll("[data-perfil]").forEach(b=>{ b.style.borderColor="var(--border)"; b.style.background="var(--card2)"; b.style.color="var(--text3)"; });
      document.getElementById("pfsel").innerHTML="";
    }catch(e){
      msg.style.display="block"; msg.style.color="var(--danger)";
      msg.textContent = e.code==="auth/email-already-in-use" ? "Esse nome de usuário já está em uso." : "Erro ao criar usuário. Tente novamente.";
    }finally{
      btn.disabled=false; btn.textContent="✓ Criar usuário";

  };
}

/* ── Helpers visuais ── */
function statusBarHTML(lista){
  let html=`<div class="status-bar">`;
  Object.entries(STATUS_META).forEach(([k,m])=>{
    const c=lista.filter(([,p])=>statusOf(p)===k).length;
    if(c>0) html+=`<div class="status-chip" style="border-color:${m.cor}44;background:${m.bg};color:${m.cor}">
      <span class="status-count">${c}</span><span class="status-lbl">${m.l}</span></div>`;
  });
  return html+`</div>`;
}
function cardHTML(id,p,ordem){
  const st=statusOf(p); const sm=STATUS_META[st]||{l:"—",cor:"#5a7fa8",bg:"rgba(90,127,168,.1)"};
  const pm=PRIORIDADES.find(x=>x.v===p.prioridade)||PRIORIDADES[0];

      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
        <span class="badge" style="background:${sm.bg};color:${sm.cor};border:1px solid ${sm.cor}44">${sm.l}</span>
        ${p.prioridade!=="normal"?`<span class="badge" style="background:${pm.bg};color:${pm.cor};border:1px solid ${pm.cor}44">${pm.l}</span>`:""}
        ${p.outroExame?`<span class="badge" style="color:var(--purple);border-color:var(--purple)44" title="${(p.outrasModalidades||[]).join(", ")}">+ outro exame</span>`:""}
      </div>

}
function kpi(label,valor,cor){ return `<div class="kpi-card" style="border-color:${cor}33"><div class="kpi-val" style="color:${cor}">${valor}</div><div class="kpi-lbl">${label}</div></div>`; }
function kpiMini(label,valor,cor){ return `<div class="kpi-mini" style="border-color:${cor}33"><div class="kpi-val" style="color:${cor};font-size:21px">${valor}</div><div class="kpi-lbl">${label}</div></div>`; }
function calcMedia(list,fn){ const vals=list.map(([,p])=>fn(p)).filter(v=>v!==null&&v>=0&&v<300); if(!vals.length) return null; return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length); }

function exportarCSV(){
  const headers=["ID","Nome","Data","Exames","Prioridade","Convenio","Turno","Operador",
    "ChegadaRecepcao","InicioRecepcao","FimRecepcao","InicioExame","FimExame",
    "EsperaMin","ExameMin","TotalMin","OutroExameMesmoDia","OutrasModalidades","Adversos","Status","Obs"];
  const rows=Object.entries(pacientes).map(([id,p])=>[
    id,p.nome,fmtDate(p.chegadaRecepcao),
    (Array.isArray(p.exames)?p.exames:[p.exame]).filter(Boolean).join("; "),
    p.prioridade,p.convenio,p.turno||"",p.operadorNome||"",
    p.chegadaRecepcao||"",p.inicioRecepcao||"",p.fimRecepcao||"",
    p.inicioExame||"",p.fimExame||"",
    diffMin(p.fimRecepcao,p.inicioExame)??"",
    diffMin(p.inicioExame,p.fimExame)??"",
    diffMin(p.chegadaRecepcao,p.fimExame)??"",
    p.outroExame?"Sim":"Não",
    (p.outrasModalidades||[]).join("; "),
    (p.adversos||[]).map(a=>a.tipo).join("; "),
    p.statusAtendimento||statusOf(p),p.obs||""
  ]);
  const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`atlas_${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

async function logout(){
  limparPerfilEscolhido();
  currentPerfil=null;
  pararListeners();
  try{ await signOut(auth); }catch(e){}
  /* onAuthStateChanged cuida de mostrar a tela de login novamente */
}

/* ══ BOOTSTRAP — verifica se já existe sessão do Firebase Auth ══ */
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    currentUser=null; currentPerfil=null; listenersOn=false;
    _mostrarLogin();
    return;
  }
  try{
    const snap=await get(ref(db,`usuarios/${user.uid}`));
    const perfilDb=snap.val();
    if(!perfilDb||perfilDb.ativo===false){
      await signOut(auth);
      _mostrarLogin("Conta não encontrada ou desativada. Fale com o administrador.");
      return;
    }
    currentUser={...perfilDb,id:user.uid};
    iniciarListeners();
    const perfis=Array.isArray(perfilDb.perfil)?perfilDb.perfil:[perfilDb.perfil];
    const salvo=carregarPerfilEscolhido();
    if(perfis.length>1){
      if(salvo&&perfis.includes(salvo)){ currentPerfil=salvo; navegarPerfil(salvo); }
      else{ render("perfil"); }
    }else{
      currentPerfil=perfis[0];
      salvarPerfilEscolhido(currentPerfil);
      navegarPerfil(currentPerfil);
    }
  }catch(err){
    console.error(err);
    await signOut(auth);
    _mostrarLogin("Erro ao carregar seu perfil. Tente novamente.");
  }
});
