<!DOCTYPE html>
<html lang="pt-BR">

<title>Atlas System · Ultrassonografia</title>

<style>
:root{
  --blue-dark:#0d1f3c;
  --blue-mid:#1a3a6b;
  --blue:#1e5fd4;
  --blue-light:#3b8bff;
  --blue-bright:#5ba3ff;
  --cyan:#00b4d8;
  --surface:#f0f4fb;
  --surface2:#e2eaf6;
  --white:#ffffff;
  --text:#0d1f3c;
  --text2:#3a5080;
  --text3:#6b82a8;
  --border:#c8d8f0;
  --success:#0d9e6e;
  --success-bg:#e6f7f2;
  --warning:#d97706;
  --warning-bg:#fef3e2;
  --danger:#dc2626;
  --danger-bg:#fef2f2;
  --purple:#7c3aed;
  --purple-bg:#f3effe;
  --radius:12px;
  --shadow:0 2px 16px rgba(30,95,212,.10);
  --shadow-lg:0 8px 40px rgba(30,95,212,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--surface);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;font-size:15px}
#app{max-width:640px;margin:0 auto;min-height:100vh}

/* ── TOPBAR ── */
.topbar{display:flex;justify-content:space-between;align-items:center;
  padding:12px 18px;background:var(--white);border-bottom:1.5px solid var(--border);
  position:sticky;top:0;z-index:50;gap:10px;box-shadow:var(--shadow)}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-brand img{height:32px;object-fit:contain}
.topbar-info{font-size:11px;color:var(--text3);font-weight:500}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar-title{font-size:14px;font-weight:700;color:var(--blue)}
.topbar-sub{font-size:11px;color:var(--text3)}

/* ── TABS ── */
.tabs-bar{display:flex;gap:2px;padding:10px 16px 0;background:var(--white);
  border-bottom:1.5px solid var(--border)}
.tab{flex:1;padding:9px 4px;border:none;border-radius:8px 8px 0 0;font-family:inherit;
  font-size:12px;font-weight:700;cursor:pointer;background:transparent;
  color:var(--text3);transition:all .15s;letter-spacing:.2px}
.tab.active{background:var(--blue-dark);color:#fff}

/* ── CONTENT ── */
.content{padding:16px;padding-bottom:80px}
.screen{display:flex;flex-direction:column;min-height:100vh}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:linear-gradient(145deg,#0d1f3c 0%,#1a3a6b 50%,#1e5fd4 100%)}
.login-card{width:100%;max-width:380px;background:var(--white);border-radius:24px;
  padding:36px 30px;box-shadow:var(--shadow-lg)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo img{height:56px;object-fit:contain;margin-bottom:12px}
.login-subtitle{font-size:13px;color:var(--text3);font-weight:500}
.login-divider{height:1px;background:var(--border);margin:20px 0}
.login-hint-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;font-size:12px;color:var(--text3);text-align:center;margin-top:12px}

/* ── FORMS ── */
.field-group{margin-bottom:14px}
.field-label{display:block;font-size:11px;font-weight:700;color:var(--text3);
  margin-bottom:5px;letter-spacing:.8px;text-transform:uppercase}
.field-input{width:100%;padding:11px 14px;border-radius:10px;background:var(--surface);
  border:1.5px solid var(--border);color:var(--text);font-size:14px;
  font-family:inherit;outline:none;transition:border-color .15s;appearance:none}
.field-input:focus{border-color:var(--blue);background:var(--white)}
.field-input option{background:var(--white);color:var(--text)}
textarea.field-input{resize:vertical;min-height:70px}

/* ── BUTTONS ── */
.btn-primary{padding:12px 22px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-light) 100%);
  color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;
  letter-spacing:.2px;transition:opacity .15s;box-shadow:0 4px 14px rgba(30,95,212,.3)}
.btn-primary:hover{opacity:.9}
.btn-primary.full{width:100%}
.btn-accent{padding:9px 18px;border-radius:9px;border:1.5px solid var(--blue);
  background:var(--blue);color:#fff;font-weight:700;font-size:12px;
  cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-accent:hover{opacity:.85}
.btn-ghost{padding:9px 16px;border-radius:9px;border:1.5px solid var(--border);
  background:transparent;color:var(--text3);font-weight:600;font-size:12px;
  cursor:pointer;font-family:inherit;transition:all .15s}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--white);color:var(--text2);font-weight:700;font-size:11px;
  cursor:pointer;font-family:inherit;transition:all .15s}
.btn-sm:hover{border-color:var(--blue);color:var(--blue)}
.btn-danger{padding:11px 18px;border-radius:10px;border:1.5px solid var(--danger);
  background:var(--danger-bg);color:var(--danger);font-weight:700;font-size:13px;
  cursor:pointer;font-family:inherit}
.btn-success{padding:13px 22px;border-radius:10px;border:none;
  background:linear-gradient(135deg,var(--success) 0%,#0fb880 100%);
  color:#fff;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;
  width:100%;letter-spacing:.3px;box-shadow:0 4px 14px rgba(13,158,110,.25);
  margin-top:4px}
.btn-back{padding:8px 14px;border-radius:9px;border:1.5px solid var(--border);
  background:var(--white);color:var(--text3);font-weight:700;font-size:13px;
  cursor:pointer;font-family:inherit}

/* ── CARDS ── */
.pac-card{background:var(--white);border:1.5px solid var(--border);
  border-left:4px solid var(--blue);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;cursor:pointer;
  transition:box-shadow .15s,border-color .15s;box-shadow:var(--shadow)}
.pac-card:hover{box-shadow:var(--shadow-lg);border-color:var(--blue-light)}
.pac-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pac-card-name{font-size:15px;font-weight:800;color:var(--text);margin-bottom:3px}
.pac-card-sub{font-size:12px;color:var(--text3);line-height:1.5}
.pac-card-time{font-size:11px;color:var(--text3);margin-top:4px;
  font-family:'IBM Plex Mono',monospace}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:.4px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--text3)}

/* ── STATUS BAR ── */
.status-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.status-chip{padding:6px 12px;border-radius:8px;border:1.5px solid;
  font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
.status-count{font-size:16px;font-weight:900}

/* ── TIMESTAMPS ── */
.ts-section{background:var(--white);border:1.5px solid var(--border);
  border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.ts-section-title{font-size:11px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px;
  color:var(--text2)}
.ts-btn{display:flex;flex-direction:column;align-items:flex-start;padding:13px 16px;
  border-radius:10px;width:100%;background:var(--surface);
  border:1.5px solid var(--border);cursor:pointer;font-family:inherit;
  text-align:left;margin-bottom:8px;transition:all .2s}
.ts-btn:last-child{margin-bottom:0}
.ts-btn.ts-done{background:var(--success-bg);border-color:#0d9e6e66}
.ts-btn.ts-disabled{opacity:.45;cursor:not-allowed}
.ts-btn.ts-readonly{cursor:default;background:var(--surface2)}
.ts-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--text3);margin-bottom:4px}
.ts-time{font-size:16px;font-weight:800;font-family:'IBM Plex Mono',monospace;
  color:var(--text);letter-spacing:.5px}
.ts-btn.ts-done .ts-time{color:var(--success)}
.ts-check{font-size:10px;color:var(--success);margin-top:3px;font-weight:700}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:420px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{padding:14px 10px;border-radius:12px;text-align:center;
  border:1.5px solid var(--border);background:var(--white);box-shadow:var(--shadow)}
.kpi-mini{padding:12px 8px;border-radius:10px;text-align:center;
  border:1.5px solid var(--border);background:var(--white)}
.kpi-val{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--blue)}
.kpi-lbl{font-size:10px;color:var(--text3);letter-spacing:.8px;
  text-transform:uppercase;margin-top:3px;font-weight:600}

/* ── CHART ── */
.exam-chart{background:var(--white);border:1.5px solid var(--border);
  border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chart-row:last-child{margin-bottom:0}
.chart-label{font-size:11px;color:var(--text);width:150px;flex-shrink:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.chart-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.chart-bar{height:100%;background:var(--blue);border-radius:3px;transition:width .5s}
.chart-val{font-size:12px;font-weight:800;color:var(--blue);width:24px;text-align:right}

/* ── ADVERSE ── */
.adverse-chip{padding:8px 12px;border-radius:8px;background:var(--warning-bg);
  border:1.5px solid #d9770633;font-size:12px;color:var(--text);
  margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}

/* ── PAC HEADER ── */
.pac-header{background:linear-gradient(135deg,var(--blue-dark) 0%,var(--blue-mid) 100%);
  border-radius:14px;padding:20px;margin-bottom:16px;color:#fff}
.pac-name{font-size:20px;font-weight:900;margin-bottom:4px}
.pac-meta{font-size:12px;opacity:.75;margin-bottom:2px}
.pac-id{font-size:11px;opacity:.5;font-family:'IBM Plex Mono',monospace;margin-top:4px}

/* ── SECTION TITLE ── */
.section-title{font-size:11px;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--text3);margin-bottom:12px;
  padding-bottom:8px;border-bottom:1.5px solid var(--border)}
.list-header{font-size:12px;font-weight:800;color:var(--text3);
  letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;
  display:flex;align-items:center;gap:6px}

/* ── MODAL ── */
#modal-overlay{position:fixed;inset:0;background:rgba(13,31,60,.6);
  z-index:1000;display:none;align-items:flex-end;justify-content:center;
  padding:0;backdrop-filter:blur(4px)}
.modal-card{background:var(--white);border-radius:24px 24px 0 0;
  padding:24px 22px;width:100%;max-width:640px;max-height:92vh;
  overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;
  margin:0 auto 20px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:17px;font-weight:800;color:var(--text)}

/* ── EXAME MULTI-SELECT ── */
.exame-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;
  max-height:280px;overflow-y:auto;padding-right:4px}
@media(min-width:400px){.exame-grid{grid-template-columns:repeat(2,1fr)}}
.exame-chip{padding:9px 10px;border-radius:9px;border:1.5px solid var(--border);
  background:var(--surface);font-size:12px;font-weight:600;color:var(--text2);
  cursor:pointer;transition:all .15s;text-align:left;font-family:inherit;line-height:1.3}
.exame-chip:hover{border-color:var(--blue-light);background:#eff5ff}
.exame-chip.selected{border-color:var(--blue);background:#eff5ff;color:var(--blue);font-weight:800}
.exame-selected-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;min-height:28px}
.exame-tag{padding:4px 10px;border-radius:20px;background:var(--blue);
  color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
.exame-tag-remove{cursor:pointer;opacity:.7;font-size:13px;line-height:1}
.exame-tag-remove:hover{opacity:1}

/* ── STATUS ATENDIMENTO ── */
.status-atend-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.status-atend-btn{padding:14px;border-radius:10px;border:2px solid var(--border);
  background:var(--surface);cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;color:var(--text2);transition:all .2s;text-align:center}
.status-atend-btn.sel-concluido{border-color:var(--success);background:var(--success-bg);color:var(--success)}
.status-atend-btn.sel-cancelado{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}

/* ── REPORT TABLE ── */
.report-table{background:var(--white);border:1.5px solid var(--border);
  border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.rt-header,.rt-row{display:grid;grid-template-columns:1fr .7fr .7fr 1fr 1fr;
  gap:8px;padding:10px 14px;font-size:12px}
.rt-header{background:var(--blue-dark);color:#fff;font-weight:700;
  font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.rt-row{border-top:1px solid var(--border);color:var(--text)}
.rt-row:hover{background:var(--surface)}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:52px 24px;color:var(--text3);
  font-size:14px;background:var(--white);border:1.5px dashed var(--border);
  border-radius:14px;line-height:1.8}

/* ── ERROR ── */
.error-msg{font-size:12px;color:var(--danger);padding:9px 12px;
  background:var(--danger-bg);border-radius:9px;margin-bottom:10px;
  border:1px solid #dc262622;font-weight:600}

/* ── PRIORITY SELECTOR ── */
.prio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prio-btn{padding:9px 6px;border-radius:9px;border:1.5px solid var(--border);
  background:var(--surface);cursor:pointer;font-family:inherit;
  font-size:11px;font-weight:700;color:var(--text3);transition:all .2s;text-align:center}

/* ── ADMIN ── */
.admin-user-card{background:var(--white);border:1.5px solid var(--border);
  border-radius:12px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow)}
.profile-tag{display:inline-block;padding:3px 8px;border-radius:6px;
  font-size:10px;font-weight:800;letter-spacing:.5px;margin-right:4px;margin-bottom:4px}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>

let currentPerfil = null; // perfil ativo selecionado pelo usuário

/* ══════════════════════════════════════════════════════════
   ROTEADOR
══════════════════════════════════════════════════════════ */
function render(tela, dados={}){
  // Limpa listeners de detalhe anteriores
  if(tela !== "detalhe" && unsubPac) { /* mantém o listener global */ }
  document.getElementById("app").innerHTML = "";
  document.getElementById("app").dataset.tela = tela;
  const fns = { login:telaLogin, perfil:telaSelecionaPerfil,
    recepcao:telaRecepcao, sala:telaSala, supervisor:telaSupervisor,
    detalhe:telaDetalhe, admin:telaAdmin };
  (fns[tela]||telaLogin)(dados);
}

/* ══════════════════════════════════════════════════════════
   LISTENERS GLOBAIS (tempo real)
══════════════════════════════════════════════════════════ */
function iniciarListeners(){
  if(unsubPac) return;
  const pacRef = ref(db,"pacientes");
  onValue(pacRef, snap => {
    pacientes = snap.val()||{};
    atualizarConteudo();
  });
  const userRef = ref(db,"usuarios");
  onValue(userRef, snap => { usuarios = snap.val()||{}; });
  unsubPac = true;
}

function atualizarConteudo(){
  const tela = document.getElementById("app")?.dataset?.tela;
  if(!tela) return;
  if(tela==="recepcao")   conteudoRecepcao();
  if(tela==="sala")       conteudoSala();
  if(tela==="supervisor") conteudoSupervisor(tabAtiva);
  if(tela==="detalhe")    atualizarDetalhe();
}

/* ══════════════════════════════════════════════════════════
   LOGIN
══════════════════════════════════════════════════════════ */
function telaLogin(){
  document.getElementById("app").innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="https://i.imgur.com/placeholder.png" id="login-logo-img" alt="Atlas System" onerror="this.style.display='none'"/>
        <div style="font-size:22px;font-weight:900;color:var(--blue-dark);letter-spacing:-.5px">Atlas <span style="color:var(--blue)">System</span></div>
        <div class="login-subtitle">Sistema de Coleta · Ultrassonografia</div>
      </div>
      <div class="login-divider"></div>
      <div class="field-group">
        <label class="field-label">Usuário</label>
        <input id="l-user" class="field-input" placeholder="seu.usuario" autocomplete="off" autocorrect="off" autocapitalize="off"/>
      </div>
      <div class="field-group">
        <label class="field-label">Senha</label>
        <input id="l-pass" class="field-input" type="password" placeholder="••••••"/>
      </div>
      <div id="l-err" class="error-msg" style="display:none"></div>
      <button class="btn-primary full" id="l-btn">Entrar</button>
    </div>
  </div>`;

  // Carregar logo em base64 do Firebase
  get(ref(db,"config/logoBase64")).then(snap=>{
    if(snap.val()){
      const img = document.getElementById("login-logo-img");
      if(img){ img.src = snap.val(); img.style.display="block"; img.style.height="52px"; img.style.marginBottom="10px"; }
    }
  }).catch(()=>{});

  const doLogin = async () => {
    const u = document.getElementById("l-user").value.trim().toLowerCase();
    const p = document.getElementById("l-pass").value;
    const err = document.getElementById("l-err");
    if(!u||!p){ err.style.display="block"; err.textContent="Preencha usuário e senha."; return; }

    // Admin fixo permanente
    if(u===ADMIN_FIXO.usuario && p===ADMIN_FIXO.senha){
      currentUser = ADMIN_FIXO;
      iniciarListeners();
      if(ADMIN_FIXO.perfil.length>1) render("perfil");
      else { currentPerfil=ADMIN_FIXO.perfil[0]; render("admin"); }
      return;
    }
    // Usuários do Firebase
    const snap = await get(ref(db,"usuarios"));
    const lista = snap.val()||{};
    let found = null;
    Object.entries(lista).forEach(([id,ud])=>{
      if(ud.usuario===u && ud.senha===p && ud.ativo!==false) found={...ud,id};
    });
    if(!found){ err.style.display="block"; err.textContent="Usuário ou senha incorretos."; return; }
    currentUser = found;
    iniciarListeners();
    const perfis = Array.isArray(found.perfil)?found.perfil:[found.perfil];
    if(perfis.length>1) render("perfil");
    else { currentPerfil=perfis[0]; navegarPerfil(perfis[0]); }
  };

  document.getElementById("l-btn").onclick = doLogin;
  document.getElementById("l-pass").onkeydown = e=>{ if(e.key==="Enter") doLogin(); };
}

function conteudoRecepcao(){
  const el = document.getElementById("content-recepcao");
  if(!el) return;
  const hoje = Object.entries(pacientes)
    .filter(([,p])=>fmtDate(p.chegadaRecepcao)===todayStr())
    .sort((a,b)=>new Date(a[1].chegadaRecepcao)-new Date(b[1].chegadaRecepcao));

  const ativos = hoje.filter(([,p])=>!p.statusAtendimento&&!p.fimExame);
  const enc    = hoje.filter(([,p])=>p.statusAtendimento||p.fimExame);

  let html = statusBarHTML(hoje);

  if(ativos.length===0&&enc.length===0){
    html+=`<div class="empty-state">Nenhum paciente hoje.<br><span style="font-size:12px;opacity:.6">Toque em "+ Novo" para registrar.</span></div>`;
  }
  if(ativos.length>0){
    html+=`<div class="list-header">Ativos (${ativos.length})</div>`;
    const ord={emergencia:0,gestante:1,idoso:1,crianca:1,deficiente:1,normal:2};
    [...ativos].sort((a,b)=>(ord[a[1].prioridade]||2)-(ord[b[1].prioridade]||2))
      .forEach(([id,p])=>html+=cardHTML(id,p));
  }
  if(enc.length>0){
    html+=`<div class="list-header" style="margin-top:20px">Encerrados (${enc.length})</div>`;
    enc.slice(0,40).forEach(([id,p])=>html+=cardHTML(id,p));
  }
  el.innerHTML=html;
  el.querySelectorAll("[data-pid]").forEach(c=>{
    c.onclick=()=>render("detalhe",{id:c.dataset.pid,origem:"recepcao"});
  });
}

    html+=`<div class="list-header" style="color:var(--success)">🟢 Em Exame (${emExame.length})</div>`;

  el.querySelectorAll("[data-pid]").forEach(c=>{

}

function conteudoSupervisor(aba="painel"){
  tabAtiva=aba;
  const el=document.getElementById("content-supervisor");
  if(!el) return;
  const hoje=Object.entries(pacientes).filter(([,p])=>fmtDate(p.chegadaRecepcao)===todayStr());
  const conc =hoje.filter(([,p])=>p.statusAtendimento==="concluido"||p.fimExame);

  if(aba==="painel"){
    const ativos=hoje.filter(([,p])=>!p.statusAtendimento&&!p.fimExame);
    const canc  =hoje.filter(([,p])=>p.statusAtendimento==="cancelado");
    const me=calcMedia(conc,p=>diffMin(p.fimRecepcao,p.inicioExame));
    const mx=calcMedia(conc,p=>diffMin(p.inicioExame,p.fimExame));
    const mt=calcMedia(conc,p=>diffMin(p.chegadaRecepcao,p.fimExame));

    let html=`<div class="kpi-grid">
      ${kpi("Total Hoje",hoje.length,"var(--blue)")}
      ${kpi("Concluídos",conc.length,"var(--success)")}
      ${kpi("Ativos",ativos.length,"var(--warning)")}
      ${kpi("Cancelados",canc.length,"var(--danger)")}
    </div>
    <div class="kpi-grid" style="margin-top:10px">
      ${kpi("Espera Média",me!=null?me+"min":"—","var(--warning)")}
      ${kpi("Exame Médio",mx!=null?mx+"min":"—","var(--blue)")}
      ${kpi("Total Médio",mt!=null?mt+"min":"—","var(--success)")}
    </div>`;

    const tC={};
    hoje.forEach(([,p])=>{ (Array.isArray(p.exames)?p.exames:[p.exame]).filter(Boolean).forEach(e=>{ tC[e]=(tC[e]||0)+1; }); });
    const maxT=Math.max(...Object.values(tC),1);
    if(Object.keys(tC).length){
      html+=`<div class="section-title" style="margin-top:20px">Exames Hoje</div><div class="exam-chart">`;
      Object.entries(tC).sort((a,b)=>b[1]-a[1]).forEach(([tipo,cnt])=>{
        html+=`<div class="chart-row">
          <div class="chart-label">${tipo}</div>
          <div class="chart-bar-wrap"><div class="chart-bar" style="width:${Math.round(cnt/maxT*100)}%"></div></div>
          <div class="chart-val">${cnt}</div>
        </div>`;
      });
      html+=`</div>`;
    }

    const advs=hoje.flatMap(([,p])=>(p.adversos||[]).map(a=>({...a,pacNome:p.nome})));
    if(advs.length){
      html+=`<div class="section-title" style="margin-top:20px">⚠ Eventos Adversos (${advs.length})</div>`;
      advs.forEach(a=>{ html+=`<div class="adverse-chip">⚠ ${a.tipo}<span style="color:var(--text3);margin-left:8px;font-size:11px">${a.pacNome} · ${fmtTime(a.ts)}</span></div>`; });
    }
    el.innerHTML=html;

  } else if(aba==="todos"){
    let html=`<div class="section-title">Todos os registros de hoje (${hoje.length})</div>`;
    if(!hoje.length) html+=`<div class="empty-state">Nenhum registro hoje.</div>`;
    [...hoje].sort((a,b)=>new Date(b[1].chegadaRecepcao)-new Date(a[1].chegadaRecepcao))
      .forEach(([id,p])=>html+=cardHTML(id,p));
    el.innerHTML=html;
    el.querySelectorAll("[data-pid]").forEach(c=>{
      c.onclick=()=>render("detalhe",{id:c.dataset.pid,origem:"supervisor"});
    });

  } else if(aba==="relatorio"){
    const todos=Object.entries(pacientes);
    const porDia={};
    todos.forEach(([,p])=>{ const d=fmtDate(p.chegadaRecepcao); if(!porDia[d])porDia[d]=[]; porDia[d].push(p); });
    let html=`<div class="section-title">Resumo por Dia</div><div class="report-table">
      <div class="rt-header"><span>Data</span><span>Total</span><span>Concl.</span><span>Esp.Méd</span><span>Exam.Méd</span></div>`;
    Object.entries(porDia)
      .sort((a,b)=>new Date(b[0].split("/").reverse().join("-"))-new Date(a[0].split("/").reverse().join("-")))
      .slice(0,30).forEach(([dia,list])=>{
        const c=list.filter(p=>p.statusAtendimento==="concluido"||p.fimExame);
        const me=calcMedia(c.map(p=>[null,p]),p=>diffMin(p.fimRecepcao,p.inicioExame));
        const mx=calcMedia(c.map(p=>[null,p]),p=>diffMin(p.inicioExame,p.fimExame));
        html+=`<div class="rt-row"><span>${dia}</span><span>${list.length}</span><span>${c.length}</span><span>${me!=null?me+"min":"—"}</span><span>${mx!=null?mx+"min":"—"}</span></div>`;
      });
    html+=`</div>`;
    el.innerHTML=html;
  }
}

function calcMedia(list,fn){
  const vals=list.map(([,p])=>fn(p)).filter(v=>v!==null&&v>=0&&v<300);
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}

        </div>
        ${p.fimExame?`<div style="font-size:12px;color:var(--text3);margin-top:4px">Finalizado às ${fmtTime(p.fimExame)}</div>`:""}
      </div>
      `}

    </div>
  </div>
  <div id="modal-overlay"></div>`;

  document.getElementById("btn-back").onclick=()=>render(origem);

  // Adversos
  document.getElementById("btn-adv")?.addEventListener("click",()=>{
    const sel=document.getElementById("sel-adv");
    if(!sel.value) return;
    const atual=pacientes[id]?.adversos||[];
    update(ref(db,`pacientes/${id}`),{adversos:[...atual,{tipo:sel.value,ts:nowISO()}]});
    sel.value="";
  });

  // Salvar obs
  document.getElementById("btn-salvar-obs")?.addEventListener("click",()=>{
    const v=document.getElementById("obs-input").value;
    update(ref(db,`pacientes/${id}`),{obs:v});
  });

  // Status atendimento
  let statusSel=null;
  document.querySelectorAll("[data-st]").forEach(b=>{
    b.onclick=()=>{
      statusSel=b.dataset.st;
      document.querySelectorAll("[data-st]").forEach(x=>{
        x.className="status-atend-btn";
      });
      b.classList.add(statusSel==="concluido"?"sel-concluido":"sel-cancelado");
      const sd=document.getElementById("status-selecionado");
      sd.style.display="block";
      if(statusSel==="concluido"){ sd.style.background="var(--success-bg)"; sd.style.color="var(--success)"; sd.textContent="✓ Status: Concluído — clique em Finalizar para confirmar."; }
      else { sd.style.background="var(--danger-bg)"; sd.style.color="var(--danger)"; sd.textContent="✕ Status: Cancelado — clique em Finalizar para confirmar."; }
      const fb=document.getElementById("btn-finalizar");
      fb.disabled=false; fb.style.opacity="1";
      if(statusSel==="cancelado"){ fb.style.background="var(--danger)"; }
    };
  });

  document.getElementById("btn-finalizar")?.addEventListener("click",()=>{
    if(!statusSel) return;
    const obs=document.getElementById("obs-input")?.value||p.obs||"";
    const up={statusAtendimento:statusSel,obs,fimExame:p.fimExame||nowISO()};
    update(ref(db,`pacientes/${id}`),up);
  });
}

function tsBtnHTML(campo,label,p,id,bloq,hab){
  const val=p[campo];
  return `<button data-ts="${campo}" data-pid="${id}"
    class="ts-btn ${val?'ts-done':''} ${(!hab&&!val&&!bloq)?'ts-disabled':''} ${bloq?'ts-disabled ts-readonly':''}">
    <span class="ts-label">${label}</span>
    <span class="ts-time">${val?fmtTime(val):"Toque para registrar"}</span>
    ${val?`<span class="ts-check">✓ registrado</span>`:""}
  </button>`;
}
function tsRoHTML(campo,label,p){
  const val=p[campo];
  return `<div class="ts-btn ts-readonly ${val?'ts-done':''}">
    <span class="ts-label">${label}</span>
    <span class="ts-time">${val?fmtTime(val):"—"}</span>
  </div>`;
}

// Timestamps via event delegation
document.addEventListener("click",e=>{
  const btn=e.target.closest("[data-ts][data-pid]");
  if(!btn||btn.classList.contains("ts-disabled")||btn.classList.contains("ts-done")||btn.classList.contains("ts-readonly")) return;
  const campo=btn.dataset.ts;
  const pid=btn.dataset.pid;
  const p=pacientes[pid];
  if(!p||p[campo]) return;
  const reqs={inicioRecepcao:null,fimRecepcao:"inicioRecepcao",inicioExame:"fimRecepcao",fimExame:"inicioExame"};
  const req=reqs[campo];
  if(req&&!p[req]){ alert(`Registre o campo anterior primeiro.`); return; }
  const up={}; up[campo]=nowISO(); up.operadorUltimo=currentUser?.nome||"";
  update(ref(db,`pacientes/${pid}`),up);
});

      adversos:[],statusAtendimento:null

    fechar();

function atualizarTagsExame(){
  const el=document.getElementById("exame-sel-list");
  const cnt=document.getElementById("exame-count");
  if(!el) return;
  if(cnt) cnt.textContent=examesSelecionados.length?`(${examesSelecionados.length} selecionado${examesSelecionados.length>1?"s":""})`:` (selecione um ou mais)`;
  el.innerHTML=examesSelecionados.map(e=>`
    <div class="exame-tag">
      ${e.replace("US ","")}<span class="exame-tag-remove" data-rem="${e}">×</span>
    </div>`).join("");
  el.querySelectorAll("[data-rem]").forEach(r=>{
    r.onclick=()=>{
      const ex=r.dataset.rem;
      examesSelecionados=examesSelecionados.filter(x=>x!==ex);
      const chip=document.querySelector(`.exame-chip[data-exame="${ex}"]`);
      if(chip) chip.classList.remove("selected");
      atualizarTagsExame();
    };
  });
}

  let html=`<div class="status-bar">`;

    if(c>0) html+=`<div class="status-chip" style="border-color:${m.cor}44;background:${m.bg};color:${m.cor}">
      <span class="status-count">${c}</span><span class="status-lbl" style="font-size:10px">${m.l}</span>

  });
  return html+`</div>`;
}

      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0">
        <span class="badge" style="background:${sm.bg};color:${sm.cor};border-color:${sm.cor}44;border:1.5px solid">${sm.l}</span>
        ${p.prioridade!=="normal"?`<span class="badge" style="background:${pm.bg};color:${pm.cor};border-color:${pm.cor}44;border:1.5px solid">${pm.l}</span>`:""}
      </div>
    </div>
  </div>`;
}

function kpi(label,valor,cor){
  return `<div class="kpi-card" style="border-color:${cor}33">
    <div class="kpi-val" style="color:${cor}">${valor}</div>
    <div class="kpi-lbl">${label}</div>
  </div>`;
}

/* ── CSV ── */
function exportarCSV(){
  const headers=["ID","Nome","Data","Exames","Prioridade","Convenio","Turno","Operador",
    "ChegadaRecepcao","InicioRecepcao","FimRecepcao","InicioExame","FimExame",
    "EsperaMin","ExameMin","TotalMin","Adversos","Status","Obs"];
  const rows=Object.entries(pacientes).map(([id,p])=>[
    id,p.nome,fmtDate(p.chegadaRecepcao),
    (Array.isArray(p.exames)?p.exames:[p.exame]).filter(Boolean).join("; "),
    p.prioridade,p.convenio,p.turno||"",p.operadorNome||"",
    p.chegadaRecepcao||"",p.inicioRecepcao||"",p.fimRecepcao||"",
    p.inicioExame||"",p.fimExame||"",
    diffMin(p.fimRecepcao,p.inicioExame)??"",
    diffMin(p.inicioExame,p.fimExame)??"",
    diffMin(p.chegadaRecepcao,p.fimExame)??"",
    (p.adversos||[]).map(a=>a.tipo).join("; "),
    p.statusAtendimento||statusOf(p),p.obs||""
  ]);
  const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url;
  a.download=`atlas_${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

function logout(){ currentUser=null; currentPerfil=null; unsubPac=null; render("login"); }

render("login");
